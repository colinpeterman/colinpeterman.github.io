<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Your Photos | Phantom Photos</title>
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="images/favicon/favicon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="images/favicon/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@300;400;500;600;700&display=swap" />
  <link rel="stylesheet" href="style.css?v=65" />
</head>
<body class="gallery-page delivery-bg">

  <div data-site-nav></div>

  <div class="delivery-panel" id="loading-state">
    <h1 class="delivery-heading">Loading&hellip;</h1>
  </div>

  <div class="delivery-panel" id="error-state" style="display:none;">
    <h1 class="delivery-heading">Link Unavailable</h1>
    <p class="delivery-hint" id="error-message">This link has expired or is invalid.</p>
    <p class="delivery-hint">Contact the photographer if you believe this is a mistake.</p>
  </div>

  <div id="delivery-wrap" style="display:none;">
    <div class="delivery-panel delivery-panel-wide" id="content-panel">
      <h1 class="delivery-heading" id="client-heading">Your Photos</h1>
      <p class="delivery-hint" id="expiry-hint"></p>

      <button class="pw-submit" id="download-all-btn" onclick="downloadAll()">Download All (.zip)</button>

      <div class="delivery-progress" id="zip-progress-wrap" style="display:none;">
        <div class="delivery-progress-bar"><div class="delivery-progress-fill" id="zip-progress-fill"></div></div>
        <p class="delivery-hint" id="zip-progress-text"></p>
      </div>

      <div class="delivery-preview-grid" id="preview-grid"></div>
    </div>

    <div data-site-footer></div>
  </div>

  <script src="site-chrome.js"></script>
  <script src="delivery.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('t');
    let activeZipUrl = null;

    const loadingState = document.getElementById('loading-state');
    const errorState = document.getElementById('error-state');
    const deliveryWrap = document.getElementById('delivery-wrap');

    function showError(message) {
      loadingState.style.display = 'none';
      deliveryWrap.style.display = 'none';
      errorState.style.display = 'block';
      if (message) document.getElementById('error-message').textContent = message;
    }

    function formatExpiry(unixSeconds) {
      const d = new Date(unixSeconds * 1000);
      return d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
    }

    async function init() {
      if (!token) { showError('No delivery link provided.'); return; }

      let res, data;
      try {
        res = await PhantomDelivery.publicFetch(`/api/download/${encodeURIComponent(token)}`);
        data = await res.json();
      } catch (err) {
        showError('Could not reach the delivery server. Please try again later.');
        return;
      }

      if (!res.ok) { showError(data.error || 'This link has expired or is invalid.'); return; }

      document.getElementById('client-heading').textContent = `${data.client_name}'s Photos`;
      document.getElementById('expiry-hint').textContent = `Available until ${formatExpiry(data.expires_at)}`;

      window.__deliveryFiles = data.files;
      renderPreviewGrid();

      loadingState.style.display = 'none';
      deliveryWrap.style.display = 'flex';
    }

    const VIDEO_ICON_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="15" height="14" rx="2"/><path d="M17 9.5l5-3v11l-5-3z"/></svg>`;

    let gridExpanded = false;

    function renderPreviewGrid() {
      const files = window.__deliveryFiles || [];
      const grid = document.getElementById('preview-grid');
      grid.innerHTML = '';
      grid.classList.toggle('expanded', gridExpanded);
      document.getElementById('content-panel').classList.toggle('delivery-panel-full', gridExpanded);

      const visibleFiles = gridExpanded ? files : files.slice(0, 4);

      visibleFiles.forEach((file, i) => {
        const tile = document.createElement('a');
        tile.className = 'preview-tile';
        tile.title = file.name;

        const isLastCapped = !gridExpanded && i === 3 && files.length > 4;

        if (isLastCapped) {
          tile.href = '#';
          tile.onclick = (e) => {
            e.preventDefault();
            gridExpanded = true;
            renderPreviewGrid();
          };
        } else {
          tile.href = PhantomDelivery.WORKER_BASE_URL + file.url;
          tile.setAttribute('download', file.name);
        }

        const isImage = file.type && file.type.startsWith('image/');
        if (isImage) {
          const img = document.createElement('img');
          img.src = PhantomDelivery.WORKER_BASE_URL + file.url + '?preview=1';
          img.alt = file.name;
          img.loading = 'lazy';
          tile.appendChild(img);
        } else {
          const icon = document.createElement('div');
          icon.className = 'preview-tile-icon';
          icon.innerHTML = VIDEO_ICON_SVG;
          tile.appendChild(icon);
        }

        if (isLastCapped) {
          const overlay = document.createElement('div');
          overlay.className = 'preview-tile-overlay';
          overlay.textContent = `+${files.length - 4} more`;
          tile.appendChild(overlay);
        }

        grid.appendChild(tile);
      });
    }

    // FileSystemWritableFileStream.write() has real per-call overhead in
    // Chrome — piping it chunk-by-chunk straight from the network (often
    // small TCP-sized pieces) means a huge video can trigger tens of
    // thousands of tiny writes, which is slow enough to look like a hang.
    // Batch bytes into a few-MB buffer before each write instead.
    function batchForDiskWrites(minBatchSize) {
      let chunks = [];
      let size = 0;
      return new TransformStream({
        transform(chunk, controller) {
          chunks.push(chunk);
          size += chunk.byteLength;
          if (size >= minBatchSize) {
            const buf = new Uint8Array(size);
            let offset = 0;
            for (const c of chunks) { buf.set(c, offset); offset += c.byteLength; }
            controller.enqueue(buf);
            chunks = [];
            size = 0;
          }
        },
        flush(controller) {
          if (!size) return;
          const buf = new Uint8Array(size);
          let offset = 0;
          for (const c of chunks) { buf.set(c, offset); offset += c.byteLength; }
          controller.enqueue(buf);
        },
      });
    }

    // Relays a ReadableStream to the OS download manager through the
    // zip-stream-sw.js Service Worker (registered scope: /__zipstream__/).
    // Used on browsers without showSaveFilePicker (Safari, Firefox) so large
    // zips still stream straight to disk instead of buffering in page memory.
    async function streamToDiskViaServiceWorker(readableStream, filename) {
      const reg = await navigator.serviceWorker.register('/zip-stream-sw.js', { scope: '/__zipstream__/' });
      // navigator.serviceWorker.ready waits for a worker controlling the
      // *current page* — but this SW is deliberately scoped to /__zipstream__/
      // only (so it never touches normal site navigation), which never
      // includes download.html itself. So it'd hang forever; wait on this
      // specific registration instead.
      const active = reg.active || await new Promise((resolve, reject) => {
        const worker = reg.installing || reg.waiting;
        if (!worker) { reject(new Error('Service worker registration failed')); return; }
        worker.addEventListener('statechange', () => {
          if (worker.state === 'activated') resolve(worker);
          else if (worker.state === 'redundant') reject(new Error('Service worker install failed'));
        });
      });

      const id = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      const channel = new MessageChannel();
      const reader = readableStream.getReader();

      return new Promise((resolve, reject) => {
        let settled = false;
        function finish(err) {
          if (settled) return;
          settled = true;
          channel.port1.onmessage = null;
          err ? reject(err) : resolve();
        }

        function pump() {
          reader.read().then(({ value, done }) => {
            if (done) {
              channel.port1.postMessage({ type: 'close' });
              finish();
              return;
            }
            channel.port1.postMessage({ type: 'chunk', chunk: value.buffer }, [value.buffer]);
          }).catch((err) => {
            channel.port1.postMessage({ type: 'abort', message: String((err && err.message) || err) });
            finish(err);
          });
        }

        channel.port1.onmessage = (e) => {
          const msg = e.data;
          if (msg.type === 'ready') {
            // The SW only intercepts fetches inside its scope, so navigating a
            // hidden iframe there is what actually triggers a real, browser-
            // native download — same as clicking a normal file link.
            const downloadUrl = `/__zipstream__/${id}/${encodeURIComponent(filename)}`;
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = downloadUrl;
            document.body.appendChild(iframe);
            setTimeout(() => iframe.remove(), 10000);
          } else if (msg.type === 'pull') {
            pump();
          }
        };

        active.postMessage({ type: 'start', id }, [channel.port2]);
      });
    }

    function formatBytes(bytes) {
      if (!bytes) return '0 MB';
      const mb = bytes / (1024 * 1024);
      return mb >= 1024 ? `${(mb / 1024).toFixed(1)} GB` : `${mb.toFixed(0)} MB`;
    }

    async function downloadAll() {
      const files = window.__deliveryFiles || [];
      if (!files.length) return;

      const btn = document.getElementById('download-all-btn');
      const originalText = btn.textContent;
      btn.disabled = true;

      const progressWrap = document.getElementById('zip-progress-wrap');
      const progressFill = document.getElementById('zip-progress-fill');
      const progressText = document.getElementById('zip-progress-text');
      const totalBytes = files.reduce((sum, f) => sum + (f.size || 0), 0);
      let bytesDone = 0;
      let currentFileIndex = 0;

      function updateProgress() {
        const pct = totalBytes > 0 ? Math.min(100, Math.round((bytesDone / totalBytes) * 100)) : 0;
        progressFill.style.width = `${pct}%`;
        progressText.textContent = `File ${currentFileIndex + 1} of ${files.length} — ${formatBytes(bytesDone)} / ${formatBytes(totalBytes)} (${pct}%)`;
      }

      const clientName = (document.getElementById('client-heading').textContent || '').replace(/'s Photos$/, '');
      const safeName = clientName.replace(/[^a-z0-9_\- ]/gi, '_') || 'delivery';
      const filename = `${safeName}.zip`;

      // Grab a disk-writable handle as the very first await, before any other
      // async work — Chrome revokes the "user activation" showSaveFilePicker
      // needs if too much happens between the click and the call.
      let fileWritable = null;
      if ('showSaveFilePicker' in window) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: filename,
            types: [{ description: 'Zip archive', accept: { 'application/zip': ['.zip'] } }],
          });
          fileWritable = await handle.createWritable();
        } catch (err) {
          if (err && err.name === 'AbortError') { // user cancelled the save dialog
            btn.disabled = false;
            btn.textContent = originalText;
            return;
          }
          fileWritable = null; // fall through to the other strategies below
        }
      }

      // Prefetch several files at once (HTTP/2 multiplexes fine over one origin)
      // instead of waiting for each download to finish before starting the next.
      // The zip still gets built in file order, but the network round-trips
      // overlap instead of stacking up serially.
      const CONCURRENCY = 4;
      const controllers = files.map(() => new AbortController());
      const fetchPromises = new Array(files.length);
      function ensureStarted(i) {
        if (i < files.length && !fetchPromises[i]) {
          // bulk=1 tells the Worker not to count this toward the individual
          // per-file download counter — the whole zip click is counted once,
          // separately, via register-zip-download below.
          fetchPromises[i] = fetch(`${PhantomDelivery.WORKER_BASE_URL}${files[i].url}?bulk=1`, { signal: controllers[i].signal });
        }
      }

      PhantomDelivery.publicFetch(`/api/download/${encodeURIComponent(token)}/register-zip-download`, { method: 'POST' }).catch(() => {});

      progressWrap.style.display = 'block';
      progressFill.style.width = '0%';
      updateProgress();

      try {
        // Built in the browser, not on the server — zipping multi-GB deliveries
        // needs real CPU time that a Workers Free plan request can't spend.
        // The visitor's own machine does the work instead, using the same
        // per-file download endpoint that already streams reliably at any size.
        const { downloadZip } = await import('./client-zip.js');

        for (let i = 0; i < Math.min(CONCURRENCY, files.length); i++) ensureStarted(i);

        async function* entries() {
          for (let i = 0; i < files.length; i++) {
            ensureStarted(i + CONCURRENCY);
            currentFileIndex = i;
            const res = await fetchPromises[i];
            if (!res.ok) throw new Error(`Failed to fetch ${files[i].name}`);

            // Tap bytes as they actually flow into the zip (not just when the
            // fetch starts) — this is the one point that stays accurate no
            // matter which of the three save strategies below ends up used.
            const counted = res.body.pipeThrough(new TransformStream({
              transform(chunk, controller) {
                bytesDone += chunk.byteLength;
                updateProgress();
                controller.enqueue(chunk);
              },
            }));

            yield { name: files[i].name, input: counted, size: files[i].size };
          }
        }

        const zipResponse = downloadZip(entries());

        btn.textContent = 'Downloading…';

        // Stream straight to disk — never hold the whole archive in memory,
        // which is what made large video-heavy deliveries stall or crash.
        if (fileWritable) {
          await zipResponse.body.pipeThrough(batchForDiskWrites(4 * 1024 * 1024)).pipeTo(fileWritable);
        } else if ('serviceWorker' in navigator) {
          await streamToDiskViaServiceWorker(zipResponse.body, filename);
        } else {
          // Last-resort fallback for browsers with neither API — buffers in
          // memory like before, so it's still limited on very large deliveries.
          const blob = await zipResponse.blob();
          if (activeZipUrl) URL.revokeObjectURL(activeZipUrl);
          activeZipUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = activeZipUrl;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
        }
      } catch (err) {
        controllers.forEach((c) => c.abort());
        if (fileWritable) { try { await fileWritable.abort(); } catch (e) {} }
        alert(`Could not build the zip: ${err.message || err}. Try downloading files individually instead.`);
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
        progressWrap.style.display = 'none';
      }
    }

    init();
  </script>
</body>
</html>
