<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Your Photos | Phantom Photos</title>
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="images/favicon/favicon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="images/favicon/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@300;400;500;600;700&display=swap" />
  <link rel="stylesheet" href="style.css?v=96" />
</head>
<body class="gallery-page delivery-bg">

  <div data-site-nav></div>

  <div class="delivery-panel" id="loading-state">
    <h1 class="delivery-heading">Loading&hellip;</h1>
  </div>

  <div class="delivery-panel" id="error-state" style="display:none;">
    <h1 class="delivery-heading">Link Unavailable</h1>
    <p class="delivery-hint" id="error-message">This link has expired or is invalid.</p>
    <p class="delivery-hint">Contact the photographer if you believe this is a mistake.</p>
  </div>

  <div id="delivery-wrap" style="display:none;">
    <div class="delivery-panel delivery-panel-wide" id="content-panel">
      <h1 class="delivery-heading" id="client-heading">Your Photos</h1>
      <p class="delivery-hint" id="expiry-hint"></p>

      <button class="pw-submit" id="download-all-btn" onclick="downloadAll()">Download All (.zip)</button>

      <div class="delivery-progress" id="zip-progress-wrap" style="display:none;">
        <div class="delivery-progress-bar"><div class="delivery-progress-fill" id="zip-progress-fill"></div></div>
        <p class="delivery-hint" id="zip-progress-text"></p>
      </div>

      <div class="delivery-preview-grid" id="preview-grid"></div>
    </div>

    <div data-site-footer></div>
  </div>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="File viewer">
    <button class="lb-close" onclick="closeLightbox()" aria-label="Close">&#x2715;</button>
    <button class="lb-btn lb-prev" onclick="lbPrev()" aria-label="Previous">&#8249;</button>
    <div class="lightbox-img-wrap" id="lb-content"></div>
    <button class="lb-btn lb-next" onclick="lbNext()" aria-label="Next">&#8250;</button>
    <div class="lb-action-bar">
      <button class="pw-submit" id="lb-download-btn" onclick="downloadCurrentLightboxFile()">Download</button>
      <span class="lb-counter" id="lb-counter"></span>
    </div>
  </div>

  <style>
    /* .delivery-bg > *:not(.pw-gate) forces position:relative on direct
       body children (to layer above the background overlay) — outranks
       the shared .lightbox { position: fixed } rule by specificity since
       #lightbox is one of those direct children. Restore it here. */
    #lightbox { position: fixed; z-index: 9000; }
    #lightbox .lightbox-img-wrap img { max-height: 78vh; }

    .lb-action-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 9002;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px calc(14px + env(safe-area-inset-bottom, 0px)) 28px;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .lb-action-bar .pw-submit { width: auto; padding: 11px 24px; margin-top: 0; }
    .lb-action-bar .lb-counter {
      position: static;
      transform: none;
      left: auto; bottom: auto;
      color: rgba(255,255,255,0.45);
      font-size: 12px;
      letter-spacing: 0.14em;
    }

    .lb-video-placeholder {
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.6);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      margin: 0 auto 16px;
    }
    .lb-video-name {
      color: rgba(255,255,255,0.85);
      font-family: var(--font-cond);
      font-size: 14px;
      text-align: center;
      max-width: 70vw;
    }
  </style>

  <script src="site-chrome.js?v=81"></script>
  <script src="delivery.js?v=79"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('t');
    let activeZipUrl = null;

    const loadingState = document.getElementById('loading-state');
    const errorState = document.getElementById('error-state');
    const deliveryWrap = document.getElementById('delivery-wrap');

    function showError(message) {
      loadingState.style.display = 'none';
      deliveryWrap.style.display = 'none';
      errorState.style.display = 'block';
      if (message) document.getElementById('error-message').textContent = message;
    }

    function formatExpiry(unixSeconds) {
      const d = new Date(unixSeconds * 1000);
      return d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
    }

    async function init() {
      if (!token) { showError('No delivery link provided.'); return; }

      let res, data;
      try {
        res = await PhantomDelivery.publicFetch(`/api/download/${encodeURIComponent(token)}`);
        data = await res.json();
      } catch (err) {
        showError('Could not reach the delivery server. Please try again later.');
        return;
      }

      if (!res.ok) { showError(data.error || 'This link has expired or is invalid.'); return; }

      document.getElementById('client-heading').textContent = data.client_name;
      document.getElementById('expiry-hint').textContent = `Available until ${formatExpiry(data.expires_at)}`;

      window.__deliveryFiles = data.files;
      renderPreviewGrid();

      loadingState.style.display = 'none';
      deliveryWrap.style.display = 'flex';
    }

    const VIDEO_ICON_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="15" height="14" rx="2"/><path d="M17 9.5l5-3v11l-5-3z"/></svg>`;

    let gridExpanded = false;

    function renderPreviewGrid() {
      const files = window.__deliveryFiles || [];
      const grid = document.getElementById('preview-grid');
      grid.innerHTML = '';
      grid.classList.toggle('expanded', gridExpanded);
      document.getElementById('content-panel').classList.toggle('delivery-panel-full', gridExpanded);

      const visibleFiles = gridExpanded ? files : files.slice(0, 4);

      visibleFiles.forEach((file, i) => {
        const tile = document.createElement('a');
        tile.className = 'preview-tile';
        tile.title = file.name;

        const isLastCapped = !gridExpanded && i === 3 && files.length > 4;

        tile.href = '#';
        if (isLastCapped) {
          tile.onclick = (e) => {
            e.preventDefault();
            gridExpanded = true;
            renderPreviewGrid();
          };
        } else {
          tile.onclick = (e) => {
            e.preventDefault();
            openLightbox(i);
          };
        }

        const isImage = file.type && file.type.startsWith('image/');
        if (isImage) {
          const img = document.createElement('img');
          img.src = file.thumb_url
            ? PhantomDelivery.WORKER_BASE_URL + file.thumb_url
            : PhantomDelivery.WORKER_BASE_URL + file.url + '?preview=1';
          img.alt = file.name;
          img.loading = 'lazy';
          tile.appendChild(img);
        } else {
          const icon = document.createElement('div');
          icon.className = 'preview-tile-icon';
          icon.innerHTML = VIDEO_ICON_SVG;
          tile.appendChild(icon);
        }

        if (isLastCapped) {
          const overlay = document.createElement('div');
          overlay.className = 'preview-tile-overlay';
          overlay.textContent = `+${files.length - 4} more`;
          tile.appendChild(overlay);
        }

        grid.appendChild(tile);
      });
    }

    let lbCurrentIdx = 0;
    let lbOpener = null;

    function setLightboxContent(idx) {
      const files = window.__deliveryFiles || [];
      const file = files[idx];
      const wrap = document.getElementById('lb-content');
      wrap.innerHTML = '';

      const isImage = file.type && file.type.startsWith('image/');
      if (isImage) {
        const img = document.createElement('img');
        img.alt = file.name;
        img.onload = () => img.classList.add('lb-loaded');
        img.src = PhantomDelivery.WORKER_BASE_URL + file.url + '?preview=1';
        wrap.appendChild(img);
      } else {
        const placeholder = document.createElement('div');
        placeholder.className = 'lb-video-placeholder';
        placeholder.innerHTML = VIDEO_ICON_SVG;
        const name = document.createElement('p');
        name.className = 'lb-video-name';
        name.textContent = file.name;
        wrap.appendChild(placeholder);
        wrap.appendChild(name);
      }

      document.getElementById('lb-counter').textContent = `${idx + 1} / ${files.length}`;
    }

    function openLightbox(idx) {
      lbCurrentIdx = idx;
      lbOpener = document.activeElement;
      setLightboxContent(idx);
      const lb = document.getElementById('lightbox');
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
      lb.querySelector('.lb-close').focus();
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      document.getElementById('lb-content').innerHTML = '';
      document.body.style.overflow = '';
      if (lbOpener && typeof lbOpener.focus === 'function') lbOpener.focus();
      lbOpener = null;
    }

    function lbPrev() {
      const files = window.__deliveryFiles || [];
      lbCurrentIdx = (lbCurrentIdx - 1 + files.length) % files.length;
      setLightboxContent(lbCurrentIdx);
    }

    function lbNext() {
      const files = window.__deliveryFiles || [];
      lbCurrentIdx = (lbCurrentIdx + 1) % files.length;
      setLightboxContent(lbCurrentIdx);
    }

    function downloadCurrentLightboxFile() {
      const files = window.__deliveryFiles || [];
      const file = files[lbCurrentIdx];
      const a = document.createElement('a');
      a.href = PhantomDelivery.WORKER_BASE_URL + file.url;
      a.download = file.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    document.addEventListener('keydown', (e) => {
      const lb = document.getElementById('lightbox');
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') lbPrev();
      if (e.key === 'ArrowRight') lbNext();
    });

    document.getElementById('lightbox').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeLightbox();
    });

    let lbTouchStartX = 0;
    document.getElementById('lightbox').addEventListener('touchstart', (e) => {
      lbTouchStartX = e.touches[0].clientX;
    }, { passive: true });
    document.getElementById('lightbox').addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - lbTouchStartX;
      if (Math.abs(dx) > 50) dx < 0 ? lbNext() : lbPrev();
    }, { passive: true });

    // FileSystemWritableFileStream.write() has real per-call overhead in
    // Chrome — piping it chunk-by-chunk straight from the network (often
    // small TCP-sized pieces) means a huge video can trigger tens of
    // thousands of tiny writes, which is slow enough to look like a hang.
    // Batch bytes into a few-MB buffer before each write instead.
    function batchForDiskWrites(minBatchSize) {
      let chunks = [];
      let size = 0;
      return new TransformStream({
        transform(chunk, controller) {
          chunks.push(chunk);
          size += chunk.byteLength;
          if (size >= minBatchSize) {
            const buf = new Uint8Array(size);
            let offset = 0;
            for (const c of chunks) { buf.set(c, offset); offset += c.byteLength; }
            controller.enqueue(buf);
            chunks = [];
            size = 0;
          }
        },
        flush(controller) {
          if (!size) return;
          const buf = new Uint8Array(size);
          let offset = 0;
          for (const c of chunks) { buf.set(c, offset); offset += c.byteLength; }
          controller.enqueue(buf);
        },
      });
    }

    // Relays a ReadableStream to the OS download manager through the
    // zip-stream-sw.js Service Worker (registered scope: /__zipstream__/).
    // Used on browsers without showSaveFilePicker (Safari, Firefox) so large
    // zips still stream straight to disk instead of buffering in page memory.
    async function streamToDiskViaServiceWorker(readableStream, filename) {
      console.log('[SW-SETUP] Registering service worker with scope: /__zipstream__/');
      const reg = await navigator.serviceWorker.register('/zip-stream-sw.js', { scope: '/__zipstream__/' });
      // navigator.serviceWorker.ready waits for a worker controlling the
      // *current page* — but this SW is deliberately scoped to /__zipstream__/
      // only (so it never touches normal site navigation), which never
      // includes download.html itself. So it'd hang forever; wait on this
      // specific registration instead.
      const active = reg.active || await new Promise((resolve, reject) => {
        const worker = reg.installing || reg.waiting;
        if (!worker) { reject(new Error('Service worker registration failed')); return; }
        worker.addEventListener('statechange', () => {
          console.log(`[SW-SETUP] Worker state changed: ${worker.state}`);
          if (worker.state === 'activated') resolve(worker);
          else if (worker.state === 'redundant') reject(new Error('Service worker install failed'));
        });
      });

      const id = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      console.log(`[SW-SETUP] Active worker confirmed. Generated stream ID: ${id}`);
      const channel = new MessageChannel();
      const reader = readableStream.getReader();

      return new Promise((resolve, reject) => {
        let settled = false;
        function finish(err) {
          if (settled) return;
          settled = true;
          channel.port1.onmessage = null;
          console.log(`[SW-SETUP] Stream finished. Error status: ${err ? err.message || err : 'none'}`);
          err ? reject(err) : resolve();
        }

        let chunkCounter = 0;
        function pump() {
          chunkCounter++;
          const currentChunk = chunkCounter;
          console.log(`[STREAM] Pump requested. Reading chunk #${currentChunk}...`);
          reader.read().then(({ value, done }) => {
            if (done) {
              console.log('[STREAM] Source reader returned EOF (done). Sending close signal to SW.');
              channel.port1.postMessage({ type: 'close' });
              finish();
              return;
            }
            console.log(`[STREAM] Chunk #${currentChunk} read successfully. Size: ${value.byteLength} bytes. Sending to SW...`);
            channel.port1.postMessage({ type: 'chunk', chunk: value.buffer }, [value.buffer]);
          }).catch((err) => {
            console.error(`[STREAM] Source reader crashed on chunk #${currentChunk}:`, err);
            channel.port1.postMessage({ type: 'abort', message: String((err && err.message) || err) });
            finish(err);
          });
        }

        channel.port1.onmessage = (e) => {
          const msg = e.data;
          console.log(`[PORT-MESSAGE] Received command from Service Worker: "${msg.type}"`);
          if (msg.type === 'ready') {
            const downloadUrl = `/__zipstream__/${id}/${encodeURIComponent(filename)}`;
            console.log(`[PORT-MESSAGE] SW ready. Creating hidden iframe pointing to: ${downloadUrl}`);
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = downloadUrl;
            document.body.appendChild(iframe);
            setTimeout(() => {
              console.log('[STREAM] Removing download iframe from DOM');
              iframe.remove();
            }, 10000);
          } else if (msg.type === 'pull') {
            pump();
          }
        };

        console.log('[SW-SETUP] Posting "start" handshake message to active Service Worker.');
        active.postMessage({ type: 'start', id }, [channel.port2]);
      });
    }

    function formatBytes(bytes) {
      if (!bytes) return '0 MB';
      const mb = bytes / (1024 * 1024);
      return mb >= 1024 ? `${(mb / 1024).toFixed(1)} GB` : `${mb.toFixed(0)} MB`;
    }

    async function downloadAll() {
      const files = window.__deliveryFiles || [];
      if (!files.length) return;

      console.log(`[DOWNLOAD] Initiating ZIP download for ${files.length} files. Total estimated metadata count: ${files.length}`);
      const btn = document.getElementById('download-all-btn');
      const originalText = btn.textContent;
      btn.disabled = true;

      const progressWrap = document.getElementById('zip-progress-wrap');
      const progressFill = document.getElementById('zip-progress-fill');
      const progressText = document.getElementById('zip-progress-text');
      const totalBytes = files.reduce((sum, f) => sum + (f.size || 0), 0);
      let bytesDone = 0;
      let currentFileIndex = 0;

      let lastProgressPaint = 0;
      function updateProgress(force) {
        const now = performance.now();
        if (!force && now - lastProgressPaint < 100) return;
        lastProgressPaint = now;
        const pct = totalBytes > 0 ? Math.min(100, Math.round((bytesDone / totalBytes) * 100)) : 0;
        progressFill.style.width = `${pct}%`;
        progressText.textContent = `File ${currentFileIndex + 1} of ${files.length} — ${formatBytes(bytesDone)} / ${formatBytes(totalBytes)} (${pct}%)`;
      }

      const clientName = document.getElementById('client-heading').textContent || '';
      const safeName = clientName.replace(/[^a-z0-9_\- ]/gi, '_') || 'delivery';
      const filename = `${safeName}.zip`;

      const useServiceWorker = 'serviceWorker' in navigator;
      console.log(`[DOWNLOAD] Environment capabilities: useServiceWorker=${useServiceWorker}`);

      let fileWritable = null;
      if (!useServiceWorker && 'showSaveFilePicker' in window) {
        console.log('[DOWNLOAD] Service Worker not supported. Attempting native Save File Picker API fallback...');
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: filename,
            types: [{ description: 'Zip archive', accept: { 'application/zip': ['.zip'] } }],
          });
          fileWritable = await handle.createWritable();
          console.log('[DOWNLOAD] Save File Picker handle writable successfully established.');
        } catch (err) {
          if (err && err.name === 'AbortError') {
            console.warn('[DOWNLOAD] User cancelled native save file dialog.');
            btn.disabled = false;
            btn.textContent = originalText;
            return;
          }
          console.error('[DOWNLOAD] Save File Picker failed or was rejected:', err);
          fileWritable = null;
        }
      }

      const controllers = files.map(() => new AbortController());
      const fetchPromises = new Array(files.length);
      
      function ensureStarted(i) {
        if (i < files.length && !fetchPromises[i]) {
          // If the target file is a video, do NOT prefetch it in the background!
          // Only start the fetch when the zip compiler is actively ready to read it.
          const isVideo = files[i].type && files[i].type.startsWith('video/');
          if (isVideo && i > currentFileIndex) {
            console.log(`[QUEUE] Skipping prefetch for Video File #${i + 1} (${files[i].name}) until we reach it.`);
            return;
          }
          const targetUrl = `${PhantomDelivery.WORKER_BASE_URL}${files[i].url}?bulk=1`;
          console.log(`[QUEUE] Starting stream for File #${i + 1} (${files[i].name}) at URL: ${targetUrl}`);
          fetchPromises[i] = fetch(targetUrl, { signal: controllers[i].signal });
        }
      }

      console.log('[DOWNLOAD] Registering ZIP metrics hit on server.');
      PhantomDelivery.publicFetch(`/api/download/${encodeURIComponent(token)}/register-zip-download`, { method: 'POST' })
        .then(() => console.log('[DOWNLOAD] Server metrics hit registered successfully.'))
        .catch((err) => console.error('[DOWNLOAD] Server metrics failure:', err));

      progressWrap.style.display = 'block';
      progressFill.style.width = '0%';
      updateProgress(true);

      try {
        console.log('[DOWNLOAD] Importing client-zip module...');
        const { downloadZip } = await import('./client-zip.js');
        console.log('[DOWNLOAD] client-zip module loaded successfully.');

        // Initialize the first file
        ensureStarted(0);

        async function* entries() {
          for (let i = 0; i < files.length; i++) {
            currentFileIndex = i;
            
            // Guarantee the current target fetch is fully initialized.
            ensureStarted(i);
            
            // Prefetch future files only if the current file is NOT a video.
            const isVideo = files[i].type && files[i].type.startsWith('video/');
            if (!isVideo) {
              const LOOKAHEAD_CONCURRENCY = 4;
              for (let lookahead = 1; lookahead <= LOOKAHEAD_CONCURRENCY; lookahead++) {
                ensureStarted(i + lookahead);
              }
            } else {
              console.log(`[ZIP-COMPILER] Video detected on File #${i + 1} (${files[i].name}). Pausing future lookahead prefetching to prevent socket buffer contention.`);
            }

            console.log(`[ZIP-COMPILER] Awaiting active response for File #${i + 1} (${files[i].name}) in compilation loop.`);
            const res = await fetchPromises[i];
            if (!res.ok) {
              console.error(`[ZIP-COMPILER] HTTP error fetching File #${i + 1} (${files[i].name}): Status ${res.status}`);
              throw new Error(`Failed to fetch ${files[i].name}`);
            }

            console.log(`[ZIP-COMPILER] Connection open for File #${i + 1} (${files[i].name}). Injecting tracking stream...`);
            const counted = res.body.pipeThrough(new TransformStream({
              transform(chunk, controller) {
                bytesDone += chunk.byteLength;
                updateProgress();
                controller.enqueue(chunk);
              },
            }));

            yield { name: files[i].name, input: counted, size: files[i].size };
          }
        }

        console.log('[ZIP-COMPILER] Initializing ZIP compiler output stream wrapper...');
        const zipResponse = downloadZip(entries());
        console.log('[ZIP-COMPILER] ZIP stream compiler initialized successfully.');

        btn.textContent = 'Downloading…';

        if (useServiceWorker) {
          console.log('[DOWNLOAD] Starting disk write sequence via Service Worker pipeline.');
          await streamToDiskViaServiceWorker(zipResponse.body, filename);
        } else if (fileWritable) {
          console.log('[DOWNLOAD] Starting disk write sequence via FileSystemWritable handle batch loop.');
          await zipResponse.body.pipeThrough(batchForDiskWrites(4 * 1024 * 1024)).pipeTo(fileWritable);
        } else {
          console.warn('[DOWNLOAD] No disk writing API available. Falling back to native in-memory blob assembly.');
          const blob = await zipResponse.blob();
          if (activeZipUrl) URL.revokeObjectURL(activeZipUrl);
          activeZipUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = activeZipUrl;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
        }

        console.log('[DOWNLOAD] Disk write loop finished successfully.');
        updateProgress(true);
      } catch (err) {
        console.error('[DOWNLOAD] Pipeline operation crashed with error:', err);
        controllers.forEach((c) => c.abort());
        if (fileWritable) { try { await fileWritable.abort(); } catch (e) {} }
        alert(`Could not build the zip: ${err.message || err}. Try downloading files individually instead.`);
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
        progressWrap.style.display = 'none';
        console.log('[DOWNLOAD] Cleanup complete. Controls restored.');
      }
    }

    init();
  </script>
</body>
</html>
