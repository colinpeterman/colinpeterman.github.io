<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sports Photography | Phantom Photos</title>
  <meta name="description" content="Sports photography by Colin Peterman — NFL, MLS, college sports and more." />
  <link rel="icon" type="image/jpeg" href="images/favicon/DSC05981-Enhanced-NR.jpg" />
  <meta property="og:title" content="Sports Photography | Phantom Photos" />
  <meta property="og:description" content="Sports photography by Colin Peterman — NFL, MLS, college sports and more." />
  <meta property="og:image" content="https://www.colinpeterman.com/images/main/DSC08553.jpg" />
  <meta property="og:url" content="https://www.colinpeterman.com/sports.html" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://www.colinpeterman.com/images/main/DSC08553.jpg" />
  <link rel="stylesheet" href="style.css?v=12" />
</head>
<body class="gallery-page">

  <!-- NAV (dark version) -->
  <nav class="gallery-nav">
    <a href="index.html" class="nav-logo">Phantom Photos</a>
    <button class="nav-toggle" aria-label="Toggle menu" onclick="toggleNav(this)">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="sports.html" class="active">Sports</a></li>
      <li><a href="licensing.html">Licensing</a></li>
      <li><a href="#" onclick="closeNav();openContactModal();return false;">Contact</a></li>
    </ul>
  </nav>

  <!-- MASONRY GALLERY -->
  <div class="masonry-grid" id="gallery"></div>

  <!-- EMPTY STATE (shown when folder is empty) -->
  <div class="gallery-empty" id="empty-state" style="display:none;">
    <h2>No Photos Yet</h2>
    <p>Add your images to the <code>images/sports/</code> folder<br>and update <code>data/sports.json</code></p>
  </div>

  <!-- GALLERY FOOTER -->
  <footer class="gallery-footer">
    
    <div class="footer-social">
      <a href="https://www.instagram.com/phantomphotos_/" target="_blank" rel="noopener" aria-label="Instagram">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"/></svg>
      </a>
      <a href="https://twitter.com/phantomphotos_" target="_blank" rel="noopener" aria-label="Twitter">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.747l7.73-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      </a>
      <a href="mailto:colinpeterman@gmail.com" aria-label="Email">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg>
      </a>
    </div>
    
  </footer>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <button class="lb-close" onclick="closeLightbox()" aria-label="Close">&#x2715;</button>
    <button class="lb-btn lb-prev" onclick="lbPrev()" aria-label="Previous">&#8249;</button>
    <div class="lightbox-img-wrap">
      <img id="lb-img" src="" alt="Photo" />
    </div>
    <button class="lb-btn lb-next" onclick="lbNext()" aria-label="Next">&#8250;</button>
    <div class="lb-counter" id="lb-counter"></div>
  </div>

  <script>
    

    let photos = [];
    let currentIdx = 0;

    // Load photos from JSON manifest
    fetch('data/sports.json')
      .then(r => r.ok ? r.json() : [])
      .then(list => {
        for (let i = list.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [list[i], list[j]] = [list[j], list[i]];
        }
        photos = list;
        if (!photos.length) {
          document.getElementById('empty-state').style.display = 'block';
          return;
        }
        renderGallery();
      })
      .catch(() => {
        document.getElementById('empty-state').style.display = 'block';
      });

    function renderGallery() {
      const grid = document.getElementById('gallery');
      grid.innerHTML = '';
      let loadedCount = 0;
      const threshold = 12;

      photos.forEach((filename, i) => {
        const item = document.createElement('div');
        item.className = 'masonry-item';
        

        const img = document.createElement('img');
        img.alt = `Sports photo ${i + 1}`;
        img.className = 'lazy';

        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              img.src = `images/sports/${filename}`;
              img.onload = () => {
                img.classList.add('loaded');
                loadedCount++;
                if (loadedCount >= threshold) grid.classList.add('ready');
              };
              img.onerror = () => { img.src = ''; img.style.minHeight = '200px'; };
              observer.unobserve(img);
            }
          });
        }, { rootMargin: '200px' });

        item.appendChild(img);
        grid.appendChild(item);
        observer.observe(img);
      });
    }

    // Lightbox
    function openLightbox(idx) {
      currentIdx = idx;
      document.getElementById('lb-img').src = `images/sports/${photos[idx]}`;
      document.getElementById('lightbox').classList.add('open');
      updateCounter();
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      document.getElementById('lb-img').src = '';
      document.body.style.overflow = '';
    }

    function lbPrev() {
      currentIdx = (currentIdx - 1 + photos.length) % photos.length;
      document.getElementById('lb-img').src = `images/sports/${photos[currentIdx]}`;
      updateCounter();
    }

    function lbNext() {
      currentIdx = (currentIdx + 1) % photos.length;
      document.getElementById('lb-img').src = `images/sports/${photos[currentIdx]}`;
      updateCounter();
    }

    function updateCounter() {
      document.getElementById('lb-counter').textContent =
        `${currentIdx + 1} / ${photos.length}`;
    }

    // Keyboard nav
    document.addEventListener('keydown', e => {
      const lb = document.getElementById('lightbox');
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft')  lbPrev();
      if (e.key === 'ArrowRight') lbNext();
    });

    // Click outside image to close
    document.getElementById('lightbox').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeLightbox();
    });

    // Mobile nav
    function closeNav() {
      document.getElementById("nav-links").classList.remove("open");
      document.querySelector("nav").classList.remove("menu-open");
    }

    function toggleNav(btn) {
      document.getElementById('nav-links').classList.toggle('open');
    }
  </script>

  <script src="contact-modal.js"></script>
</body>
</html>
