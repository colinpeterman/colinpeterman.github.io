<body class="gallery-page">

  <!-- NAV (injected by site-chrome.js) -->
  <div data-site-nav></div>

  <!-- PAGE HEAD -->
  <header class="page-head">
    <div class="wrap">
      <p class="eyebrow reveal">Portfolio</p>
      <h1 class="display reveal" style="--reveal-delay: 80ms">Sports</h1>
    </div>
  </header>

  <!-- MASONRY GALLERY -->
  <div class="masonry-grid" id="gallery"></div>

  <!-- EMPTY STATE (shown when folder is empty) -->
  <div class="gallery-empty" id="empty-state" style="display:none;">
    <h2>No Photos Yet</h2>
    <p>Add your images to the <code>images/sports/</code> folder<br>and update <code>data/sports.json</code></p>
  </div>

  <!-- GALLERY FOOTER (injected by site-chrome.js) -->
  <div data-site-footer></div>

  <script src="site-chrome.js?v=81"></script>
  <script src="gallery.js?v=79"></script>
  <script>
    let photos = [];

    // Load photos from JSON manifest
    fetch('data/sports.json')
      .then(r => r.ok ? r.json() : [])
      .then(list => {
        for (let i = list.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [list[i], list[j]] = [list[j], list[i]];
        }
        photos = list;
        if (!photos.length) {
          document.getElementById('empty-state').style.display = 'block';
          return;
        }
        renderGallery();
      })
      .catch(() => {
        document.getElementById('empty-state').style.display = 'block';
      });

    function renderGallery() {
      const grid = document.getElementById('gallery');
      grid.innerHTML = '';

      photos.forEach((photo, i) => {
        const filename = photo.file || photo;
        const item = document.createElement('div');
        item.className = 'masonry-item';

        if (photo.w && photo.h) {
          item.style.aspectRatio = `${photo.w} / ${photo.h}`;
        }

        const img = document.createElement('img');
        img.alt = `Sports photo ${i + 1}`;
        img.className = 'lazy';
        img.dataset.src = `images/sports_thumbs/${filename}`;

        item.appendChild(img);
        grid.appendChild(item);
      });

      grid.classList.add('ready');
      loadGalleryRows(grid);
    }

    // Block right-click on gallery images
    document.getElementById('gallery').addEventListener('contextmenu', e => e.preventDefault());
  </script>

  <script src="contact-modal.js?v=79"></script>
</body>
</html>
