  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <button class="lb-close" onclick="closeLightbox()" aria-label="Close">&#x2715;</button>
    <button class="lb-btn lb-prev" onclick="lbPrev()" aria-label="Previous">&#8249;</button>
    <div class="lightbox-img-wrap">
      <img id="lb-img" src="" alt="Photo" />
    </div>
    <button class="lb-btn lb-next" onclick="lbNext()" aria-label="Next">&#8250;</button>
    <div class="lb-counter" id="lb-counter"></div>
  </div>

  <script>
    

    let photos = [];
    let currentIdx = 0;

    // Load photos from JSON manifest
    fetch('data/sports.json')
      .then(r => r.ok ? r.json() : [])
      .then(list => {
        for (let i = list.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [list[i], list[j]] = [list[j], list[i]];
        }
        photos = list;
        if (!photos.length) {
          document.getElementById('empty-state').style.display = 'block';
          return;
        }
        renderGallery();
      })
      .catch(() => {
        document.getElementById('empty-state').style.display = 'block';
      });

    function renderGallery() {
      const grid = document.getElementById('gallery');
      grid.innerHTML = '';

      photos.forEach((photo, i) => {
        const filename = photo.file || photo;
        const item = document.createElement('div');
        item.className = 'masonry-item';

        if (photo.w && photo.h) {
          item.style.aspectRatio = `${photo.w} / ${photo.h}`;
        }

        const img = document.createElement('img');
        img.alt = `Sports photo ${i + 1}`;
        img.className = 'lazy';
        img.dataset.src = `images/sports_thumbs/${filename}`;

        item.appendChild(img);
        grid.appendChild(item);
      });

      grid.classList.add('ready');

      // Read actual rendered positions after CSS columns lays out
      const allImgs = Array.from(grid.querySelectorAll('img[data-src]'));
      const items = Array.from(grid.querySelectorAll('.masonry-item'));

      const sorted = items.map((el, i) => ({
        i,
        top: el.getBoundingClientRect().top
      })).sort((a, b) => a.top - b.top);

      const rows = [];
      sorted.forEach(({ i, top }) => {
        const last = rows[rows.length - 1];
        if (last && Math.abs(top - last.top) < 10) {
          last.indices.push(i);
        } else {
          rows.push({ top, indices: [i] });
        }
      });

      let rowIdx = 0;
      function loadRow() {
        if (rowIdx >= rows.length) return;
        const { indices } = rows[rowIdx++];
        let done = 0;
        indices.forEach(i => {
          const img = allImgs[i];
          const src = img.dataset.src;
          delete img.dataset.src;
          img.onload = () => {
            done++;
            if (done === indices.length) {
              indices.forEach(j => {
                allImgs[j].classList.remove('lazy');
                allImgs[j].classList.add('loaded');
              });
              loadRow();
            }
          };
          img.onerror = () => {
            img.closest('.masonry-item').style.display = 'none';
            done++;
            if (done === indices.length) {
              indices.forEach(j => {
                allImgs[j].classList.remove('lazy');
                allImgs[j].classList.add('loaded');
              });
              loadRow();
            }
          };
          img.src = src;
        });
      }
      loadRow();
    }

    // Lightbox
    function openLightbox(idx) {
      currentIdx = idx;
      document.getElementById('lb-img').src = `images/sports/${photos[idx].file || photos[idx]}`;
      document.getElementById('lightbox').classList.add('open');
      updateCounter();
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      document.getElementById('lb-img').src = '';
      document.body.style.overflow = '';
    }

    function lbPrev() {
      currentIdx = (currentIdx - 1 + photos.length) % photos.length;
      document.getElementById('lb-img').src = `images/sports/${photos[currentIdx].file || photos[currentIdx]}`;
      updateCounter();
    }

    function lbNext() {
      currentIdx = (currentIdx + 1) % photos.length;
      document.getElementById('lb-img').src = `images/sports/${photos[currentIdx].file || photos[currentIdx]}`;
      updateCounter();
    }

    function updateCounter() {
      document.getElementById('lb-counter').textContent =
        `${currentIdx + 1} / ${photos.length}`;
    }

    // Block right-click, selection, and copy on gallery images
    document.getElementById('gallery').addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('copy', e => e.preventDefault());
    document.addEventListener('selectstart', e => e.preventDefault());

    // Keyboard nav
    document.addEventListener('keydown', e => {
      const lb = document.getElementById('lightbox');
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft')  lbPrev();
      if (e.key === 'ArrowRight') lbNext();
    });

    // Click outside image to close
    document.getElementById('lightbox').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeLightbox();
    });

    // Mobile nav
    function closeNav() {
      document.getElementById("nav-links").classList.remove("open");
      document.querySelector("nav").classList.remove("menu-open");
    }

    function toggleNav(btn) {
      document.getElementById('nav-links').classList.toggle('open');
    }
  </script>
