<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sports | Phantom Photos</title>
  <meta name="description" content="Sports Photography by Colin Peterman — Phantom Photos" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="gallery-page">

  <!-- NAV (dark version) -->
  <nav class="gallery-nav">
    <a href="index.html" class="nav-logo">Phantom Photos</a>
    <button class="nav-toggle" aria-label="Toggle menu" onclick="toggleNav(this)">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="sports.html" class="active">Sports</a></li>
      <li><a href="licensing.html">Licensing</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <!-- MASONRY GALLERY -->
  <div class="masonry-grid" id="gallery"></div>

  <!-- EMPTY STATE (shown when folder is empty) -->
  <div class="gallery-empty" id="empty-state" style="display:none;">
    <h2>No Photos Yet</h2>
    <p>Add your images to the <code>images/sports/</code> folder<br>and update <code>data/sports.json</code></p>
  </div>

  <!-- GALLERY FOOTER -->
  <footer class="gallery-footer">
    <div class="footer-brand">Phantom Photos</div>
    <div class="footer-social">
      <a href="https://www.instagram.com/phantomphotos_/" target="_blank" rel="noopener">Instagram</a>
      <a href="https://twitter.com/phantomphotos_" target="_blank" rel="noopener">Twitter</a>
      <a href="mailto:colinpeterman@gmail.com">Email</a>
    </div>
    <div class="footer-copy">&copy; <span id="year"></span> Colin Peterman. All rights reserved.</div>
  </footer>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <button class="lb-close" onclick="closeLightbox()" aria-label="Close">&#x2715;</button>
    <button class="lb-btn lb-prev" onclick="lbPrev()" aria-label="Previous">&#8249;</button>
    <div class="lightbox-img-wrap">
      <img id="lb-img" src="" alt="Photo" />
    </div>
    <button class="lb-btn lb-next" onclick="lbNext()" aria-label="Next">&#8250;</button>
    <div class="lb-counter" id="lb-counter"></div>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    let photos = [];
    let currentIdx = 0;

    // Load photos from JSON manifest
    fetch('data/sports.json')
      .then(r => r.ok ? r.json() : [])
      .then(list => {
        photos = list;
        if (!photos.length) {
          document.getElementById('empty-state').style.display = 'block';
          return;
        }
        renderGallery();
      })
      .catch(() => {
        document.getElementById('empty-state').style.display = 'block';
      });

    function renderGallery() {
      const grid = document.getElementById('gallery');
      grid.innerHTML = '';

      photos.forEach((filename, i) => {
        const item = document.createElement('div');
        item.className = 'masonry-item';
        item.onclick = () => openLightbox(i);

        const img = document.createElement('img');
        img.alt = `Sports photo ${i + 1}`;
        img.className = 'lazy';

        // Use IntersectionObserver for lazy loading
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              img.src = `images/sports/${filename}`;
              img.onload = () => img.classList.add('loaded');
              img.onerror = () => { img.src = ''; img.style.minHeight = '200px'; };
              observer.unobserve(img);
            }
          });
        }, { rootMargin: '200px' });

        item.appendChild(img);
        grid.appendChild(item);
        observer.observe(img);
      });
    }

    // Lightbox
    function openLightbox(idx) {
      currentIdx = idx;
      document.getElementById('lb-img').src = `images/sports/${photos[idx]}`;
      document.getElementById('lightbox').classList.add('open');
      updateCounter();
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      document.getElementById('lb-img').src = '';
      document.body.style.overflow = '';
    }

    function lbPrev() {
      currentIdx = (currentIdx - 1 + photos.length) % photos.length;
      document.getElementById('lb-img').src = `images/sports/${photos[currentIdx]}`;
      updateCounter();
    }

    function lbNext() {
      currentIdx = (currentIdx + 1) % photos.length;
      document.getElementById('lb-img').src = `images/sports/${photos[currentIdx]}`;
      updateCounter();
    }

    function updateCounter() {
      document.getElementById('lb-counter').textContent =
        `${currentIdx + 1} / ${photos.length}`;
    }

    // Keyboard nav
    document.addEventListener('keydown', e => {
      const lb = document.getElementById('lightbox');
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft')  lbPrev();
      if (e.key === 'ArrowRight') lbNext();
    });

    // Click outside image to close
    document.getElementById('lightbox').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeLightbox();
    });

    // Mobile nav
    function toggleNav(btn) {
      document.getElementById('nav-links').classList.toggle('open');
    }
  </script>

</body>
</html>
