<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Licensing | Phantom Photos</title>
  <meta name="description" content="License photos by Colin Peterman — high quality Cincinnati photography available for commercial and editorial use." />
  <link rel="icon" type="image/jpeg" href="images/favicon/DSC05981-Enhanced-NR.jpg" />
  <meta property="og:title" content="Image Licensing | Phantom Photos" />
  <meta property="og:description" content="License photos by Colin Peterman for commercial and editorial use." />
  <meta property="og:image" content="https://www.colinpeterman.com/images/main/DSC08553.jpg" />
  <meta property="og:url" content="https://www.colinpeterman.com/licensing.html" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://www.colinpeterman.com/images/main/DSC08553.jpg" />
  <link rel="stylesheet" href="style.css?v=13" />
</head>
<body class="gallery-page">

  <!-- NAV (dark version) -->
  <nav class="gallery-nav">
    <a href="index.html" class="nav-logo">Phantom Photos</a>
    <button class="nav-toggle" aria-label="Toggle menu" onclick="toggleNav(this)">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="sports.html">Sports</a></li>
      <li><a href="licensing.html" class="active">Licensing</a></li>
      <li><a href="#" onclick="closeNav();openContactModal();return false;">Contact</a></li>
    </ul>
  </nav>

  <!-- PASSWORD GATE -->
  <div class="pw-gate" id="pw-gate">
    <svg class="pw-lock" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    <h1>Licensing</h1>
    <p>Enter password to access the collection</p>
    <div class="pw-form">
      <input
        type="password"
        class="pw-input"
        id="pw-input"
        placeholder="Password"
        onkeydown="if(event.key==='Enter') checkPassword()"
        autocomplete="current-password"
      />
      <div class="pw-error" id="pw-error"></div>
      <button class="pw-submit" onclick="checkPassword()">Enter</button>
    </div>
    <p class="pw-contact-hint">Don't have access? <button class="pw-contact-btn" onclick="openContactModal()">Contact me</button></p>
  </div>

  <!-- GALLERY (hidden until unlocked) -->
  <div id="gallery-wrap" style="display:none;">
    <div class="masonry-grid" id="gallery"></div>

    <div class="gallery-empty" id="empty-state" style="display:none;">
      <h2>No Photos Yet</h2>
      <p>Add your images to the <code>images/licensing/</code> folder<br>and update <code>data/licensing.json</code></p>
    </div>

    <footer class="gallery-footer">
      
      <div class="footer-social">
        <a href="https://www.instagram.com/phantomphotos_/" target="_blank" rel="noopener" aria-label="Instagram">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"/></svg>
        </a>
        <a href="https://twitter.com/phantomphotos_" target="_blank" rel="noopener" aria-label="Twitter">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.747l7.73-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        </a>
        <a href="mailto:colinpeterman@gmail.com" aria-label="Email">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg>
        </a>
      </div>
      
    </footer>
  </div>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <button class="lb-close" onclick="closeLightbox()" aria-label="Close">&#x2715;</button>
    <button class="lb-btn lb-prev" onclick="lbPrev()" aria-label="Previous">&#8249;</button>
    <div class="lightbox-img-wrap">
      <img id="lb-img" src="" alt="Photo" />
    </div>
    <button class="lb-btn lb-next" onclick="lbNext()" aria-label="Next">&#8250;</button>
    <div class="lb-counter" id="lb-counter"></div>
  </div>

  <script>
    

    const HASH = 'e94918e0c6efb70bae593a93557e0bfcf78568cac4e51df7d3e5af5759e29b4d';
    const SESSION_KEY = 'pp_licensing_unlocked';

    async function sha256(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    if (sessionStorage.getItem(SESSION_KEY) === '1') {
      unlockGallery();
    }

    async function checkPassword() {
      const input = document.getElementById('pw-input').value.trim();
      const errEl = document.getElementById('pw-error');
      const hashed = await sha256(input);

      if (hashed === HASH) {
        sessionStorage.setItem(SESSION_KEY, '1');
        errEl.textContent = '';
        document.getElementById('pw-gate').style.opacity = '0';
        setTimeout(unlockGallery, 300);
      } else {
        errEl.textContent = 'Incorrect password. Please try again.';
        document.getElementById('pw-input').value = '';
        document.getElementById('pw-input').focus();
        const gate = document.getElementById('pw-gate');
        gate.style.animation = 'none';
        setTimeout(() => gate.style.animation = '', 10);
      }
    }

    function unlockGallery() {
      document.getElementById('pw-gate').style.display = 'none';
      document.getElementById('gallery-wrap').style.display = 'block';
      loadGallery();
    }

    // Gallery
    let photos = [];
    let currentIdx = 0;

    function loadGallery() {
      fetch('data/licensing.json')
        .then(r => r.ok ? r.json() : [])
        .then(list => {
          photos = list;
          if (!photos.length) {
            document.getElementById('empty-state').style.display = 'block';
            return;
          }
          renderGallery();
        })
        .catch(() => {
          document.getElementById('empty-state').style.display = 'block';
        });
    }

    function renderGallery() {
      const grid = document.getElementById('gallery');
      grid.innerHTML = '';

      photos.forEach((photo, i) => {
        const filename = photo.file || photo;
        const item = document.createElement('div');
        item.className = 'masonry-item';

        if (photo.w && photo.h) {
          item.style.aspectRatio = `${photo.w} / ${photo.h}`;
        }

        const img = document.createElement('img');
        img.alt = `Licensing photo ${i + 1}`;
        img.className = 'lazy';

        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              img.src = `images/licensing/${filename}`;
              img.onload = () => img.classList.add('loaded');
              img.onerror = () => { item.style.display = 'none'; };
              observer.unobserve(img);
            }
          });
        }, { rootMargin: '200px' });

        item.appendChild(img);
        grid.appendChild(item);
        observer.observe(img);
      });
    }

    // Lightbox
    function openLightbox(idx) {
      currentIdx = idx;
      document.getElementById('lb-img').src = `images/licensing/${photos[idx].file || photos[idx]}`;
      document.getElementById('lightbox').classList.add('open');
      updateCounter();
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      document.getElementById('lb-img').src = '';
      document.body.style.overflow = '';
    }

    function lbPrev() {
      currentIdx = (currentIdx - 1 + photos.length) % photos.length;
      document.getElementById('lb-img').src = `images/licensing/${photos[currentIdx].file || photos[currentIdx]}`;
      updateCounter();
    }

    function lbNext() {
      currentIdx = (currentIdx + 1) % photos.length;
      document.getElementById('lb-img').src = `images/licensing/${photos[currentIdx].file || photos[currentIdx]}`;
      updateCounter();
    }

    function updateCounter() {
      document.getElementById('lb-counter').textContent =
        `${currentIdx + 1} / ${photos.length}`;
    }

    document.addEventListener('keydown', e => {
      const lb = document.getElementById('lightbox');
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft')  lbPrev();
      if (e.key === 'ArrowRight') lbNext();
    });

    document.getElementById('lightbox').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeLightbox();
    });

    function closeNav() {
      document.getElementById("nav-links").classList.remove("open");
      document.querySelector("nav").classList.remove("menu-open");
    }

    function toggleNav(btn) {
      document.getElementById('nav-links').classList.toggle('open');
      document.querySelector('nav').classList.toggle('menu-open');
    }
  </script>

  <script src="contact-modal.js"></script>
</body>
</html>
