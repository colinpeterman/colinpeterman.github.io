<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Google Analytics -->

  <script>

  <title>Image Licensing | Phantom Photos</title>
  <meta name="description" content="License photos by Colin Peterman — high quality Cincinnati photography available for commercial and editorial use." />
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="images/favicon/favicon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="images/favicon/apple-touch-icon.png" />
  <meta property="og:title" content="Image Licensing | Phantom Photos" />
  <meta property="og:description" content="License photos by Colin Peterman for commercial and editorial use." />
  <meta property="og:image" content="https://www.colinpeterman.com/images/og-image.jpg" />
  <meta property="og:url" content="https://www.colinpeterman.com/licensing.html" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Image Licensing | Phantom Photos" />
  <meta name="twitter:description" content="License photos by Colin Peterman for commercial and editorial use." />
  <meta name="twitter:image" content="https://www.colinpeterman.com/images/og-image.jpg" />
  <link rel="canonical" href="https://www.colinpeterman.com/licensing.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@300;400;500;600;700&display=swap" />
  <link rel="stylesheet" href="style.css?v=67" />
</head>
<body class="gallery-page">

  <!-- NAV (injected by site-chrome.js) -->
  <div data-site-nav></div>

  <!-- PASSWORD GATE -->
  <div class="pw-gate" id="pw-gate">
    <svg class="pw-lock" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    <h1>Licensing</h1>
    <p>Enter password to access the collection</p>
    <div class="pw-form">
      <input
        type="password"
        class="pw-input"
        id="pw-input"
        placeholder="Password"
        onkeydown="if(event.key==='Enter') checkPassword()"
        autocomplete="current-password"
      />
      <div class="pw-error" id="pw-error" role="alert" aria-live="polite"></div>
      <button class="pw-submit" onclick="checkPassword()">Enter</button>
    </div>
    <p class="pw-contact-hint">Don't have access? <button class="pw-contact-btn" onclick="openContactModal()">Contact me</button></p>
  </div>

  <!-- GALLERY (hidden until unlocked) -->
  <div id="gallery-wrap" style="display:none;">
    <div class="masonry-grid" id="gallery"></div>

    <div class="gallery-empty" id="empty-state" style="display:none;">
      <h2>No Photos Yet</h2>
      <p>Add your images to the <code>images/licensing/</code> folder<br>and update <code>data/licensing.json</code></p>
    </div>

    <!-- GALLERY FOOTER (injected by site-chrome.js) -->
    <div data-site-footer></div>
  </div>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lb-close" onclick="closeLightbox()" aria-label="Close">&#x2715;</button>
    <button class="lb-btn lb-prev" onclick="lbPrev()" aria-label="Previous">&#8249;</button>
    <div class="lightbox-img-wrap">
      <img id="lb-img" src="" alt="Photo" />
      <button class="lb-check-btn" id="lb-inquire-btn" onclick="toggleInquiry()" aria-label="Add to inquiry"></button>
    </div>
    <button class="lb-btn lb-next" onclick="lbNext()" aria-label="Next">&#8250;</button>
    <!-- Bottom action bar -->
    <div class="lb-action-bar">
      <span class="lb-counter" id="lb-counter"></span>
    </div>
  </div>

  <!-- FLOATING INQUIRY CONTROLS -->
  <div class="inquiry-controls" id="inquiry-controls">
    <button class="inquiry-filter-btn" id="inquiry-filter-btn" onclick="toggleSelectionFilter()">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6h22M5 12h14M9 18h6"/></svg>
      <span id="inquiry-filter-label">View Selection</span>
    </button>
    <button class="inquiry-cart" id="inquiry-cart" onclick="submitInquiry()">
      <span class="inquiry-cart-badge" id="inquiry-cart-badge">0</span>
      <span id="inquiry-cart-label">Inquire about 0 photos</span>
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </button>
  </div>

  <style>
    /* Lightbox image — leave room for action bar */
    #lightbox .lightbox-img-wrap {
      position: relative;
    }
    #lightbox .lightbox-img-wrap img {
      max-height: 78vh;
    }

    /* Bottom action bar */
    .lb-action-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 9002;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px calc(14px + env(safe-area-inset-bottom, 0px)) 28px;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    /* Override global lb-counter positioning */
    .lb-action-bar .lb-counter {
      position: static;
      transform: none;
      left: auto; bottom: auto;
      color: rgba(255,255,255,0.45);
      font-size: 12px;
      letter-spacing: 0.14em;
    }

    /* Checkmark button — top-right corner of lightbox image */
    .lb-check-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.7);
      background: rgba(0,0,0,0.25);
      cursor: pointer;
      z-index: 10;
    }
    .lb-check-btn::after {
      content: '+';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 300;
      color: rgba(255,255,255,0.9);
      line-height: 1;
    }
    .lb-check-btn.added {
      background: #fff;
      border-color: #fff;
    }
    .lb-check-btn.added::after {
      content: '✓';
      font-size: 16px;
      font-weight: 600;
      color: #111;
    }

    /* Thumbnail checkbox overlay */
    .masonry-item .masonry-select-badge {
      position: absolute;
      top: 8px; right: 8px;
      z-index: 3;
      width: 24px; height: 24px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.7);
      background: rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .masonry-item .masonry-select-badge::before {
      content: '+';
      color: rgba(255,255,255,0.9);
      font-size: 16px;
      font-weight: 300;
      line-height: 1;
    }
    .masonry-item.selected .masonry-select-badge {
      background: #fff;
      border-color: #fff;
    }
    .masonry-item.selected .masonry-select-badge::before {
      content: '✓';
      color: #111;
      font-size: 13px;
      font-weight: 600;
    }
    /* Extend touch target without affecting visual */
    .masonry-item .masonry-select-badge::after {
      content: '';
      position: absolute;
      inset: -10px;
    }

    /* Floating cart container */
    /* Floating controls wrapper */
    .inquiry-controls {
      display: none;
      position: fixed;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      right: 24px;
      z-index: 10001;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }
    .inquiry-controls.visible { display: flex; }
    .inquiry-controls.lb-open { bottom: 80px; }

    /* View Selection toggle */
    .inquiry-filter-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      color: #111;
      border: none;
      font-family: var(--font-cond);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 9px 14px;
      border-radius: 100px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      white-space: nowrap;
    }
    .inquiry-filter-btn:hover { background: #f0f0f0; }

    /* Filter active — hide non-selected items */
    .masonry-grid.filter-active .masonry-item:not(.selected) {
      display: none;
    }

    /* Floating cart pill */
    .inquiry-cart {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      color: #111;
      font-family: var(--font-cond);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 12px 18px 12px 8px;
      border-radius: 100px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      white-space: nowrap;
      transition: background 0.2s;
    }
    .inquiry-cart:hover { background: #f0f0f0; }

    .inquiry-cart-badge {
      background: #111;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      width: 26px; height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
  </style>

  <script src="site-chrome.js"></script>
  <script src="gallery.js"></script>
  <script>
    const HASH = 'e94918e0c6efb70bae593a93557e0bfcf78568cac4e51df7d3e5af5759e29b4d';
    // TEMPORARY password added 2026-07-13. Remove this line to revoke it.
    const HASH_TEMP = '2276233cdc480265f604ebb626e6ada734c2f91b71ed0bc9a7203b50fbe2b27a';
    const SESSION_KEY = 'pp_licensing_unlocked';

    async function sha256(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    // Inquiry cart — persisted in sessionStorage
    const INQUIRY_KEY = 'pp_inquiry';
    const inquirySet = new Set(JSON.parse(sessionStorage.getItem(INQUIRY_KEY) || '[]'));
    function saveInquiry() {
      sessionStorage.setItem(INQUIRY_KEY, JSON.stringify([...inquirySet]));
    }

    if (sessionStorage.getItem(SESSION_KEY) === '1') {
      unlockGallery();
    }

    // Restore cart visibility if items were saved
    if (inquirySet.size > 0) updateCart();

    async function checkPassword() {
      const input = document.getElementById('pw-input').value.trim();
      const errEl = document.getElementById('pw-error');
      const hashed = await sha256(input);

      if (hashed === HASH || hashed === HASH_TEMP) {
        sessionStorage.setItem(SESSION_KEY, '1');
        errEl.textContent = '';
        document.getElementById('pw-gate').style.opacity = '0';
        setTimeout(unlockGallery, 300);
      } else {
        errEl.textContent = 'Incorrect password. Please try again.';
        document.getElementById('pw-input').value = '';
        document.getElementById('pw-input').focus();
        const gate = document.getElementById('pw-gate');
        gate.style.animation = 'none';
        setTimeout(() => gate.style.animation = '', 10);
      }
    }

    function unlockGallery() {
      document.getElementById('pw-gate').style.display = 'none';
      document.getElementById('gallery-wrap').style.display = 'block';
      // Blur input to dismiss keyboard, then scroll to top
      document.getElementById('pw-input').blur();
      setTimeout(() => window.scrollTo({ top: 0, behavior: 'instant' }), 100);
      loadGallery();
    }

    // Gallery
    let photos = [];
    let currentIdx = 0;

    function loadGallery() {
      fetch('data/licensing.json')
        .then(r => r.ok ? r.json() : [])
        .then(list => {
          photos = list;
          if (!photos.length) {
            document.getElementById('empty-state').style.display = 'block';
            return;
          }
          renderGallery();
        })
        .catch(() => {
          document.getElementById('empty-state').style.display = 'block';
        });
    }

    function renderGallery() {
      const grid = document.getElementById('gallery');
      grid.innerHTML = '';

      photos.forEach((photo, i) => {
        const filename = photo.file || photo;
        const item = document.createElement('div');
        item.className = 'masonry-item';
        item.dataset.filename = filename;
        if (inquirySet.has(filename)) item.classList.add('selected');
        item.style.cursor = 'pointer';
        item.onclick = () => openLightbox(i);
        // Keyboard access — items are divs, so make them focusable + Enter/Space activatable
        item.tabIndex = 0;
        item.setAttribute('role', 'button');
        item.setAttribute('aria-label', `View photo ${i + 1}`);
        item.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openLightbox(i);
          }
        });

        const badge = document.createElement('div');
        badge.className = 'masonry-select-badge';
        badge.title = 'Add to inquiry';
        badge.tabIndex = 0;
        badge.setAttribute('role', 'button');
        badge.setAttribute('aria-label', `Add photo ${i + 1} to inquiry`);
        badge.addEventListener('click', e => {
          e.stopPropagation();
          toggleInquiryByFilename(filename);
        });
        badge.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            e.stopPropagation();
            toggleInquiryByFilename(filename);
          }
        });
        item.appendChild(badge);

        if (photo.w && photo.h) {
          item.style.aspectRatio = `${photo.w} / ${photo.h}`;
        }

        const img = document.createElement('img');
        img.alt = `Licensing photo ${i + 1}`;
        img.className = 'lazy';
        img.dataset.src = `images/licensing_thumbs/${filename}`;

        item.appendChild(img);
        grid.appendChild(item);
      });

      grid.classList.add('ready');
      loadGalleryRows(grid);

      // Re-sync cart visibility after gallery renders (covers session-restore race)
      updateCart();
    }

    function toggleInquiryByFilename(filename) {
      if (inquirySet.has(filename)) {
        inquirySet.delete(filename);
      } else {
        inquirySet.add(filename);
      }
      saveInquiry();
      updateCart();
      const thumb = document.querySelector(`.masonry-item[data-filename="${CSS.escape(filename)}"]`);
      if (thumb) thumb.classList.toggle('selected', inquirySet.has(filename));
      // Sync lightbox button if this photo is open
      if (photos[currentIdx] && (photos[currentIdx].file || photos[currentIdx]) === filename) {
        updateInquiryBtn();
      }
    }

    function toggleInquiry() {
      const filename = photos[currentIdx].file || photos[currentIdx];
      toggleInquiryByFilename(filename);
    }

    function updateInquiryBtn() {
      const filename = photos[currentIdx] ? (photos[currentIdx].file || photos[currentIdx]) : null;
      if (!filename) return;
      const btn = document.getElementById('lb-inquire-btn');
      btn.classList.toggle('added', inquirySet.has(filename));
    }

    function updateCart() {
      const controls  = document.getElementById('inquiry-controls');
      const badge     = document.getElementById('inquiry-cart-badge');
      const label     = document.getElementById('inquiry-cart-label');
      // Guard: if elements aren't in the DOM yet, retry on next frame
      if (!controls || !badge || !label) {
        requestAnimationFrame(updateCart);
        return;
      }
      const count = inquirySet.size;
      badge.textContent = count;
      label.textContent = `Inquire about ${count} photo${count === 1 ? '' : 's'}`;
      controls.classList.toggle('visible', count > 0);
      // If filter is active but selection is now empty, turn it off
      if (count === 0) deactivateFilter();
    }

    let filterActive = false;

    function toggleSelectionFilter() {
      filterActive ? deactivateFilter() : activateFilter();
    }

    function activateFilter() {
      closeLightbox();
      filterActive = true;
      document.getElementById('gallery').classList.add('filter-active');
      document.getElementById('inquiry-filter-label').textContent = 'Show All';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deactivateFilter() {
      filterActive = false;
      document.getElementById('gallery').classList.remove('filter-active');
      const label = document.getElementById('inquiry-filter-label');
      if (label) label.textContent = 'View Selection';
    }

    function submitInquiry() {
      const list = [...inquirySet].map((f, i) => `${i + 1}. ${f}`).join('\n');
      const msg = `Hi Colin, I'm interested in licensing the following photo${inquirySet.size > 1 ? 's' : ''}:\n\n${list}\n\nPlease let me know pricing and usage details.`;
      closeLightbox();
      openContactModal('Licensing Inquiry');
      setTimeout(() => {
        const ta = document.getElementById('cm-message');
        if (ta) ta.value = msg;
      }, 50);
      // Don't clear yet — only clear after the form is actually submitted
    }

    // Lightbox
    function setLightboxImage(idx) {
      const img = document.getElementById('lb-img');
      img.classList.remove('lb-loaded');
      img.onload = () => img.classList.add('lb-loaded');
      img.src = `images/licensing/${photos[idx].file || photos[idx]}`;
    }

    let lbOpener = null;

    function openLightbox(idx) {
      currentIdx = idx;
      setLightboxImage(idx);
      const lb = document.getElementById('lightbox');
      lbOpener = document.activeElement;
      lb.classList.add('open');
      document.getElementById('inquiry-controls').classList.add('lb-open');
      updateCounter();
      updateInquiryBtn();
      document.body.style.overflow = 'hidden';
      lb.querySelector('.lb-close').focus();
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      document.getElementById('inquiry-controls').classList.remove('lb-open');
      document.getElementById('lb-img').src = '';
      document.body.style.overflow = '';
      // Return focus to the thumbnail that opened the lightbox
      if (lbOpener && typeof lbOpener.focus === 'function') lbOpener.focus();
      lbOpener = null;
    }

    function lbPrev() {
      currentIdx = (currentIdx - 1 + photos.length) % photos.length;
      setLightboxImage(currentIdx);
      updateCounter();
      updateInquiryBtn();
    }

    function lbNext() {
      currentIdx = (currentIdx + 1) % photos.length;
      setLightboxImage(currentIdx);
      updateCounter();
      updateInquiryBtn();
    }

    function updateCounter() {
      document.getElementById('lb-counter').textContent =
        `${currentIdx + 1} / ${photos.length}`;
    }

    // Keyboard nav + focus trap while the lightbox is open
    document.addEventListener('keydown', e => {
      const lb = document.getElementById('lightbox');
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft')  lbPrev();
      if (e.key === 'ArrowRight') lbNext();
      if (e.key === 'Tab') {
        // Note: lightbox buttons are position:fixed (offsetParent is null),
        // so query them directly rather than filtering on visibility
        const focusables = Array.from(lb.querySelectorAll('button'));
        if (!focusables.length) return;
        const first = focusables[0];
        const last = focusables[focusables.length - 1];
        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault(); last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault(); first.focus();
        } else if (!lb.contains(document.activeElement)) {
          e.preventDefault(); first.focus();
        }
      }
    });

    document.getElementById('lightbox').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeLightbox();
    });

    // Swipe gestures
    let touchStartX = 0;
    const lb = document.getElementById('lightbox');
    lb.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
    lb.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 50) dx < 0 ? lbNext() : lbPrev();
    }, { passive: true });
  </script>

  <script src="contact-modal.js"></script>
</body>
</html>
