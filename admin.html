<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Delivery Admin | Phantom Photos</title>
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="images/favicon/favicon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="images/favicon/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@300;400;500;600;700&display=swap" />
  <link rel="stylesheet" href="style.css?v=56" />
</head>
<body class="gallery-page">

  <div data-site-nav></div>

  <!-- ADMIN GATE -->
  <div class="pw-gate admin-gate" id="pw-gate">
    <svg class="pw-lock" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    <h1>Admin</h1>
    <p>Enter the admin key to create a delivery</p>
    <div class="pw-form">
      <input
        type="password"
        class="pw-input"
        id="pw-input"
        placeholder="Admin key"
        onkeydown="if(event.key==='Enter') checkAdminKey()"
        autocomplete="current-password"
      />
      <div class="pw-error" id="pw-error" role="alert" aria-live="polite"></div>
      <button class="pw-submit" onclick="checkAdminKey()">Enter</button>
    </div>
  </div>

  <!-- DELIVERY BUILDER (hidden until unlocked) -->
  <div id="admin-wrap" style="display:none;">
    <div class="delivery-panel">
      <h1 class="delivery-heading">New Delivery</h1>

      <div class="delivery-field">
        <label for="client-name">Client name</label>
        <input type="text" id="client-name" placeholder="e.g. Smith Wedding" />
      </div>

      <div class="delivery-field">
        <label for="expiry-days">Link expires after (days)</label>
        <input type="number" id="expiry-days" value="14" min="1" />
      </div>

      <div class="delivery-field">
        <label for="file-input">Photos &amp; videos</label>
        <input type="file" id="file-input" multiple webkitdirectory directory />
        <p class="delivery-hint" id="file-count-hint">No files selected</p>
      </div>

      <button class="pw-submit" id="start-upload-btn" onclick="startDelivery()" disabled>Create &amp; Upload</button>

      <div class="delivery-progress" id="progress-wrap" style="display:none;">
        <div class="delivery-progress-bar"><div class="delivery-progress-fill" id="progress-fill"></div></div>
        <p class="delivery-hint" id="progress-text"></p>
      </div>

      <div class="delivery-result" id="result-wrap" style="display:none;">
        <p class="delivery-hint">Send this link to your client:</p>
        <div class="delivery-link-row">
          <input type="text" class="pw-input" id="result-link" readonly />
          <button class="pw-submit" id="copy-link-btn" onclick="copyLink()">Copy</button>
        </div>
      </div>

      <div class="delivery-error" id="delivery-error" role="alert" aria-live="polite"></div>
    </div>

    <div data-site-footer></div>
  </div>

  <script src="site-chrome.js"></script>
  <script src="delivery.js"></script>
  <script>
    const fileInput = document.getElementById('file-input');
    const fileCountHint = document.getElementById('file-count-hint');
    const startBtn = document.getElementById('start-upload-btn');

    fileInput.addEventListener('change', () => {
      const n = fileInput.files.length;
      fileCountHint.textContent = n ? `${n} file${n === 1 ? '' : 's'} selected` : 'No files selected';
      startBtn.disabled = n === 0;
    });

    async function checkAdminKey() {
      const input = document.getElementById('pw-input').value.trim();
      const errEl = document.getElementById('pw-error');
      if (!input) return;

      PhantomDelivery.setAdminKey(input);
      const res = await PhantomDelivery.adminFetch('/api/admin/ping').catch(() => null);

      if (res && res.ok) {
        errEl.textContent = '';
        document.getElementById('pw-gate').style.opacity = '0';
        setTimeout(() => {
          document.getElementById('pw-gate').style.display = 'none';
          document.getElementById('admin-wrap').style.display = 'block';
        }, 300);
      } else {
        PhantomDelivery.clearAdminKey();
        errEl.textContent = 'Incorrect key or server unreachable. Please try again.';
        document.getElementById('pw-input').value = '';
        document.getElementById('pw-input').focus();
      }
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function uploadOneFile(token, file) {
      const urlRes = await PhantomDelivery.adminFetch(
        `/api/admin/deliveries/${token}/upload-url`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: file.name, contentType: file.type || 'application/octet-stream' }),
        }
      );
      const urlData = await urlRes.json();
      if (!urlRes.ok) throw new Error(urlData.error || `Failed to get upload URL for ${file.name}`);

      const putRes = await fetch(urlData.upload_url, {
        method: 'PUT',
        headers: { 'Content-Type': file.type || 'application/octet-stream' },
        body: file,
      });
      if (!putRes.ok) throw new Error(`Upload failed for ${file.name}`);

      const registerRes = await PhantomDelivery.adminFetch(
        `/api/admin/deliveries/${token}/register-file`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: file.name, size: file.size, type: file.type || 'application/octet-stream' }),
        }
      );
      if (!registerRes.ok) {
        const registerData = await registerRes.json();
        throw new Error(registerData.error || `Failed to register ${file.name}`);
      }
    }

    async function startDelivery() {
      const clientName = document.getElementById('client-name').value.trim();
      const expiryDays = Number(document.getElementById('expiry-days').value);
      const files = Array.from(fileInput.files);
      const errEl = document.getElementById('delivery-error');
      errEl.textContent = '';

      if (!clientName) { errEl.textContent = 'Client name is required.'; return; }
      if (!files.length) { errEl.textContent = 'Select at least one file.'; return; }

      startBtn.disabled = true;
      const progressWrap = document.getElementById('progress-wrap');
      const progressFill = document.getElementById('progress-fill');
      const progressText = document.getElementById('progress-text');
      progressWrap.style.display = 'block';

      try {
        const createRes = await PhantomDelivery.adminFetch('/api/admin/deliveries', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ client_name: clientName, expiry_days: expiryDays }),
        });
        const createData = await createRes.json();
        if (!createRes.ok) throw new Error(createData.error || 'Failed to create delivery');

        const token = createData.token;
        const MAX_ATTEMPTS = 3;
        const RETRY_DELAY_MS = 1500;

        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          progressFill.style.width = `${Math.round((i / files.length) * 100)}%`;

          let lastErr;
          let uploaded = false;
          for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
            progressText.textContent = attempt === 1
              ? `Uploading ${i + 1} / ${files.length}: ${file.name}`
              : `Retrying (${attempt}/${MAX_ATTEMPTS}) ${i + 1} / ${files.length}: ${file.name}`;
            try {
              await uploadOneFile(token, file);
              uploaded = true;
              break;
            } catch (err) {
              lastErr = err;
              if (attempt < MAX_ATTEMPTS) await sleep(RETRY_DELAY_MS);
            }
          }
          if (!uploaded) {
            throw new Error(`Failed to upload ${file.name} after ${MAX_ATTEMPTS} attempts: ${lastErr.message}`);
          }
        }

        progressFill.style.width = '100%';
        progressText.textContent = `Done — ${files.length} file${files.length === 1 ? '' : 's'} uploaded.`;

        document.getElementById('result-link').value = createData.download_link;
        document.getElementById('result-wrap').style.display = 'block';
      } catch (err) {
        errEl.textContent = err.message || String(err);
        startBtn.disabled = false;
      }
    }

    function copyLink() {
      const input = document.getElementById('result-link');
      input.select();
      navigator.clipboard.writeText(input.value).catch(() => document.execCommand('copy'));
      const btn = document.getElementById('copy-link-btn');
      const original = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = original; }, 1500);
    }
  </script>
</body>
</html>
