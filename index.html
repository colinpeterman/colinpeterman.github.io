  <style>
    /* ── Hero Masonry ── */
    .hero-masonry-wrap {
      position: relative;
      width: 100%;
      height: calc(100vh - var(--nav-h));
      margin-top: var(--nav-h);
      overflow: hidden;
      background: #111;
    }

    .hero-masonry {
      columns: 5;
      column-gap: 0;
      padding: 0;
      position: absolute;
      top: 0; left: 0; right: 0;
    }

    @media (max-width: 1000px) { .hero-masonry { columns: 4; } }
    @media (max-width: 680px)  { .hero-masonry { columns: 3; } }

    .hero-masonry-item {
      break-inside: avoid;
      margin-bottom: 0;
      overflow: hidden;
    }

    .hero-masonry-item img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Whole masonry fades in together */
    .hero-masonry {
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    .hero-masonry.ready { opacity: 1; }

    @media (prefers-reduced-motion: reduce) {
      .hero-masonry { transition: none; }
      .hero-masonry-item img { transition: none !important; }
    }

    /* Dark overlay over the masonry */
    .hero-grid-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.2);
      z-index: 1;
    }

    /* Centered name + tagline */
    .hero-grid-text {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      padding: 0 24px;
    }

    .hero-grid-name {
      font-family: var(--font-disp);
      font-size: clamp(44px, 12vw, 160px);
      letter-spacing: 0.06em;
      line-height: 1;
      text-transform: uppercase;
      white-space: nowrap;
      -webkit-text-stroke: 1px rgba(0,0,0,0.6);
      paint-order: stroke fill;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.5), -1px -1px 3px rgba(0,0,0,0.5);
    }

    .hero-grid-sub {
      font-family: var(--font-cond);
      font-weight: 600;
      font-size: clamp(13px, 3.5vw, 22px);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #fff;
      margin-top: 16px;
      white-space: nowrap;
      -webkit-text-stroke: 1px rgba(0,0,0,0.6);
      paint-order: stroke fill;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.5), -1px -1px 3px rgba(0,0,0,0.5);
    }

    /* Dark nav always visible */
    body.hero-page nav {
      background: var(--bg-dark);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    body.hero-page nav .nav-logo,
    body.hero-page nav .nav-links a {
      color: #fff;
    }

    body.hero-page nav .nav-toggle span {
      background: #fff;
    }
  </style>
</head>
<body class="hero-page">

  <!-- NAV (injected by site-chrome.js) -->
  <div data-site-nav></div>

  <!-- HERO MASONRY -->
  <div class="hero-masonry-wrap">
    <div class="hero-masonry" id="hero-masonry"></div>
    <div class="hero-grid-overlay"></div>
    <div class="hero-grid-text">
      <h1 class="hero-grid-name">Colin Peterman</h1>
      <p class="hero-grid-sub">Cincinnati &mdash; Photography &amp; Videography</p>
    </div>
  </div><!-- /hero-masonry-wrap -->

  <!-- FOOTER (injected by site-chrome.js) -->
  <div data-site-footer></div>

  <script src="site-chrome.js"></script>
  <script>
    const masonry = document.getElementById('hero-masonry');
    let loadedCount = 0;
    let threshold = 20;

    fetch('data/main.json')
      .then(r => r.ok ? r.json() : [])
      .then(list => {
        // Fade in once the first screenful is loaded — never wait for more
        // photos than the manifest actually has
        threshold = Math.min(threshold, list.length);
        if (!list.length) masonry.classList.add('ready');
        // Shuffle
        for (let i = list.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [list[i], list[j]] = [list[j], list[i]];
        }

        list.forEach(photo => {
          const filename = photo.file || photo;
          const item = document.createElement('div');
          item.className = 'hero-masonry-item';

          if (photo.w && photo.h) {
            item.style.aspectRatio = `${photo.w} / ${photo.h}`;
          }

          const img = document.createElement('img');
          img.alt = '';
          img.style.opacity = '0';
          img.style.transition = 'opacity 0.4s ease';
          img.src = `images/main/${filename}`;
          img.onload = () => {
            img.style.opacity = '1';
            loadedCount++;
            if (loadedCount >= threshold) masonry.classList.add('ready');
          };

          item.appendChild(img);
          masonry.appendChild(item);
        });
      })
      .catch(() => {
        masonry.classList.add('ready');
      });
  </script>

  <!-- Game overlay (iframe src is set on first open so the game never loads for regular visitors) -->
  <div id="game-overlay" style="display:none; position:fixed; inset:0; z-index:9999; background:#07080f;">
    <iframe id="game-frame" style="width:100%; height:100%; border:none;"></iframe>
  </div>

  <script>
    document.getElementById('nav-logo').addEventListener('click', function(e) {
      e.preventDefault();
      const frame = document.getElementById('game-frame');
      if (!frame.getAttribute('src')) frame.src = 'game.html';
      document.getElementById('game-overlay').style.display = 'block';
      setTimeout(() => frame.contentWindow.focus(), 100);
    });

    function closeGame() {
      document.getElementById('game-overlay').style.display = 'none';
      // Remove the iframe src so next open starts fresh
      document.getElementById('game-frame').removeAttribute('src');
    }
  </script>

  <script src="contact-modal.js"></script>
</body>
</html>
