<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phantom Photos | Colin Peterman</title>
  <meta name="description" content="Colin Peterman | Cincinnati Based Photographer and Videographer" />
  <link rel="stylesheet" href="style.css?v=11" />
  <style>
    /* ── Hero Masonry ── */
    .hero-masonry-wrap {
      position: relative;
      width: 100%;
      height: calc(100vh - var(--nav-h));
      margin-top: var(--nav-h);
      overflow: hidden;
      background: #111;
    }

    .hero-masonry {
      columns: 5;
      column-gap: 0;
      padding: 0;
      position: absolute;
      top: 0; left: 0; right: 0;
    }

    @media (max-width: 1000px) { .hero-masonry { columns: 4; } }
    @media (max-width: 680px)  { .hero-masonry { columns: 3; } }

    .hero-masonry-item {
      break-inside: avoid;
      margin-bottom: 0;
      overflow: hidden;
    }

    .hero-masonry-item img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Whole masonry fades in together */
    .hero-masonry {
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    .hero-masonry.ready { opacity: 1; }

    /* Dark overlay over the masonry */
    .hero-grid-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 1;
    }

    /* Centered name + tagline */
    .hero-grid-text {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      padding: 0 24px;
    }

    .hero-grid-name {
      font-family: var(--font-disp);
      font-size: clamp(64px, 12vw, 140px);
      letter-spacing: 0.06em;
      line-height: 1;
      text-transform: uppercase;
    }

    .hero-grid-sub {
      font-family: var(--font-cond);
      font-weight: 600;
      font-size: clamp(14px, 2vw, 18px);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #fff;
      margin-top: 16px;
      text-shadow: 0 1px 8px rgba(0,0,0,0.8);
    }

    .hero-grid-links {
      display: flex;
      gap: 20px;
      margin-top: 40px;
    }

    .hero-grid-links a {
      font-family: var(--font-cond);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #fff;
      border: 2px solid rgba(255,255,255,0.75);
      padding: 12px 28px;
      transition: background 0.2s, border-color 0.2s;
    }

    .hero-grid-links a:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.8);
    }

    /* Scroll hint arrow */
    .hero-scroll-hint {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: rgba(255,255,255,0.4);
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50%       { transform: translateX(-50%) translateY(6px); }
    }

    /* Dark nav always visible */
    body.hero-page nav {
      background: var(--bg-dark);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    body.hero-page nav .nav-logo,
    body.hero-page nav .nav-links a {
      color: #fff;
    }

    body.hero-page nav .nav-toggle span {
      background: #fff;
    }
  </style>
</head>
<body class="hero-page">

  <!-- NAV -->
  <nav>
    <a href="index.html" class="nav-logo">Phantom Photos</a>
    <button class="nav-toggle" aria-label="Toggle menu" onclick="toggleNav(this)">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="nav-links">
      <li><a href="index.html" class="active">Home</a></li>
      <li><a href="sports.html">Sports</a></li>
      <li><a href="licensing.html">Licensing</a></li>
      <li><a href="#" onclick="openContactModal();return false;">Contact</a></li>
    </ul>
  </nav>

  <!-- HERO MASONRY -->
  <div class="hero-masonry-wrap">
    <div class="hero-masonry" id="hero-masonry"></div>
    <div class="hero-grid-overlay"></div>
    <div class="hero-grid-text">
      <h1 class="hero-grid-name">Colin Peterman</h1>
      <p class="hero-grid-sub">Cincinnati &mdash; Photography &amp; Videography</p>
      <div class="hero-grid-links">
        <a href="sports.html">Sports</a>
        <a href="licensing.html">Licensing</a>
        <a href="#" onclick="openContactModal();return false;">Contact</a>
      </div>
    </div>
  </div><!-- /hero-masonry-wrap -->

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="footer-brand">Phantom Photos</div>
    <div class="footer-social">
      <a href="https://www.instagram.com/phantomphotos_/" target="_blank" rel="noopener" aria-label="Instagram">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"/></svg>
      </a>
      <a href="https://twitter.com/phantomphotos_" target="_blank" rel="noopener" aria-label="Twitter">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.747l7.73-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      </a>
      <a href="mailto:colinpeterman@gmail.com" aria-label="Email">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg>
      </a>
    </div>
    <div class="footer-copy">&copy; <span id="year"></span> Colin Peterman. All rights reserved.</div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    function toggleNav(btn) {
      document.getElementById('nav-links').classList.toggle('open');
    }

    // Transparent nav becomes dark on scroll
    window.addEventListener('scroll', () => {
      document.body.classList.toggle('scrolled', window.scrollY > 60);
    });

    const mainPhotos = [
      'CMP01984-Enhanced-NR.jpg','CMP02038-Enhanced-NR.jpg','CMP02077.jpg',
      'DJI_0073-HDR-Pano.jpg','DJI_0130-HDR.jpg','DJI_0136-HDR-Pano.jpg',
      'DJI_0155-Enhanced-NR.jpg','DJI_0188-Enhanced-NR.jpg','DJI_0458-Pano.jpg',
      'DJI_0629-HDR-Pano.jpg','DJI_0726-Enhanced-NR.jpg','DJI_0796-Enhanced-NR.jpg',
      'DSC00372.jpg','DSC00429-Enhanced-NR.jpg','DSC00703.jpg','DSC01544-Enhanced-NR.jpg',
      'DSC02440.jpg','DSC03579.jpg','DSC05389.jpg','DSC06920.jpg','DSC07076-Enhanced-NR.jpg',
      'DSC07391-Enhanced-NR.jpg','DSC07558.jpg','DSC08268.jpg','DSC08553.jpg',
      'DSC09107.jpg','DSC09445-Enhanced-NR.jpg','Final-Tall.jpg','final.jpg',
      'rainbow.jpg','thirdfinal.jpg'
    ];

    // Shuffle
    for (let i = mainPhotos.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [mainPhotos[i], mainPhotos[j]] = [mainPhotos[j], mainPhotos[i]];
    }

    const masonry = document.getElementById('hero-masonry');
    let loadedCount = 0;
    const threshold = 8;

    mainPhotos.forEach(filename => {
      const item = document.createElement('div');
      item.className = 'hero-masonry-item';
      const img = document.createElement('img');
      img.alt = '';
      img.src = `images/main/${filename}`;
      img.onload = () => {
        loadedCount++;
        if (loadedCount >= threshold) masonry.classList.add('ready');
      };
      item.appendChild(img);
      masonry.appendChild(item);
    });
  </script>

  <script src="contact-modal.js"></script>
</body>
</html>
