<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phantom Photos | Colin Peterman</title>
  <meta name="description" content="Colin Peterman | Cincinnati Based Photographer and Videographer" />
  <link rel="stylesheet" href="style.css?v=7" />
</head>
<body>

  <!-- NAV -->
  <nav>
    <a href="index.html" class="nav-logo">Phantom Photos</a>
    <button class="nav-toggle" aria-label="Toggle menu" onclick="toggleNav(this)">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="nav-links">
      <li><a href="index.html" class="active">Home</a></li>
      <li><a href="sports.html">Sports</a></li>
      <li><a href="licensing.html">Licensing</a></li>
      <li><a href="contact.html">Contact</a></li>

  <div class="page-wrap">

    <!-- HERO -->
    <section class="hero">
      <div class="hero-img">
        <!--
          HERO IMAGE SETUP:
          Replace the placeholder below with your own hero image.
          Save it as: images/hero.jpg
          Then replace this entire placeholder div with:
          <img src="images/hero.jpg" alt="Colin Peterman Photography" />
        -->
        <img src="images/main/header.jpg" alt="Colin Peterman Photography" />
      </div>
      <div class="hero-text">
        <h1 class="hero-name">Colin Peterman</h1>
      </div>
    </section>

    <!-- SPORTS SECTION -->
    <section class="home-sections">
      <div class="home-section">
        <div class="home-section-img">
          <!--
            SPORTS PREVIEW IMAGE:
            Save a preview image as: images/home-sports.jpg

            <img src="images/home-sports.jpg" alt="Sports Photography" />

          <img src="images/main/sports.jpg" alt="Sports Photography" />
        </div>
        <div class="home-section-text">
          <h2>Sports<br>Photography</h2>
          <a href="sports.html" class="btn-outline">View Series →</a>

            LICENSING PREVIEW IMAGE:

            <img src="images/home-licensing.jpg" alt="Image Licensing" />

          <h2>Image<br>Licensing</h2>
          <a href="licensing.html" class="btn-outline">Browse Collection →</a>
        </div>

      <div class="footer-brand">Phantom Photos</div>
      <div class="footer-social">
        <a href="https://www.instagram.com/phantomphotos_/" target="_blank" rel="noopener">Instagram</a>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    function toggleNav(btn) {
      const links = document.getElementById('nav-links');
      links.classList.toggle('open');
    }
  </script>
