<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-H2D46TFCS3"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-H2D46TFCS3');
  </script>
  <title>Phantom Fly</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #07080f;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      overscroll-behavior: none;
    }
    canvas { display: block; will-change: transform; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<button id="back-btn" onclick="goBack()" style="
  position:fixed; top:14px; left:14px; z-index:10;
  background:none; border:none; cursor:pointer;
  font-family:'Barlow Condensed',sans-serif; font-weight:700;
  font-size:13px; letter-spacing:0.12em; text-transform:uppercase;
  color:rgba(255,255,255,0.35); padding:6px 4px;
">← BACK</button>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

// Fixed game dimensions — no stretching
const W = 360;
const H = 620;
canvas.width  = W;
canvas.height = H;

// Scale canvas to fit screen while keeping aspect ratio
function fitCanvas() {
  const scaleX = window.innerWidth  / W;
  const scaleY = window.innerHeight / H;
  const scale  = Math.min(scaleX, scaleY);
  canvas.style.width  = Math.floor(W * scale) + 'px';
  canvas.style.height = Math.floor(H * scale) + 'px';
}
fitCanvas();
window.addEventListener('resize', fitCanvas);

// ── Physics ─────────────────────────────────────────────
const GRAVITY  = 0.42;
const FLAP_V   = -8;
const PIPE_W   = 56;
const GAP      = 148;
const PIPE_SPD_BASE = 3.0;
const PIPE_SPD_MAX  = 9.0;
let   pipeSpd = PIPE_SPD_BASE;

// ── State ───────────────────────────────────────────────
let state     = 'idle';
let score     = 0;
let hiScore   = +localStorage.getItem('pp_fly_hi') || 0;
let tick      = 0;
let pipes     = [];
let particles = [];
let popups    = [];
let pipeTimer = 0;
let shakeTime = 0;
let newBest   = false;
const PIPE_INTERVAL = 140;

// ── Color lerp ───────────────────────────────────────────
function lerpColor(a, b, t) {
  const ah = parseInt(a.slice(1), 16), bh = parseInt(b.slice(1), 16);
  const ar = (ah >> 16) & 0xff, ag = (ah >> 8) & 0xff, ab = ah & 0xff;
  const br = (bh >> 16) & 0xff, bg = (bh >> 8) & 0xff, bb = bh & 0xff;
  const r = Math.round(ar + (br - ar) * t);
  const g = Math.round(ag + (bg - ag) * t);
  const bl = Math.round(ab + (bb - ab) * t);
  return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${bl.toString(16).padStart(2,'0')}`;
}

// ── Drone ───────────────────────────────────────────────
const DW = 30, DH = 14;
const drone = { x: W * 0.28, y: H * 0.45, vy: 0, tilt: 0 };
let propSpin = 0;

function resetDrone() {
  drone.y  = H * 0.45;
  drone.vy = 0;
  drone.tilt = 0;
}

// ── Stars — pre-rendered to offscreen canvas ─────────────
const stars = Array.from({ length: 55 }, () => ({
  x: Math.random() * W,
  y: Math.random() * H * 0.7,
  r: 0.5 + Math.random() * 1.2,
  a: 0.2 + Math.random() * 0.5,
  twinkle: Math.random() * Math.PI * 2
}));

const starCanvas = document.createElement('canvas');
starCanvas.width = W; starCanvas.height = H;
const starCtx = starCanvas.getContext('2d');
stars.forEach(s => {
  starCtx.globalAlpha = s.a;
  starCtx.fillStyle = '#ffffff';
  starCtx.beginPath();
  starCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
  starCtx.fill();
});
starCtx.globalAlpha = 1;

// ── BG buildings (parallax, pre-generated) ───────────────
const bgBuilds = [];
(function () {
  let x = 0;
  while (x < W + 200) {
    const bw = 24 + Math.floor(Math.random() * 40);
    const bh = 50 + Math.floor(Math.random() * 160);
    bgBuilds.push({ x, w: bw, h: bh });
    x += bw + 3 + Math.floor(Math.random() * 8);
  }
})();
let bgScroll = 0;

// ── Window pre-computation ───────────────────────────────
function makeWindows(bw, bh) {
  const wins = [];
  const cols = Math.max(1, Math.floor((bw - 8) / 11));
  const rows = Math.max(1, Math.floor((bh - 12) / 14));
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (Math.random() < 0.28) continue; // some dark
      wins.push({ c, r, warm: Math.random() > 0.45 });
    }
  }
  return wins;
}

// ── Pipe spawn ───────────────────────────────────────────
function spawnPipe() {
  const minH = 70;
  const maxH = H - GAP - minH - 30;
  const topH = minH + Math.floor(Math.random() * maxH);
  const botH = H - topH - GAP;
  pipes.push({
    x:    W + PIPE_W,
    topH,
    botY: topH + GAP,
    botH,
    passed: false,
    topWins: makeWindows(PIPE_W, topH),
    botWins: makeWindows(PIPE_W, botH)
  });
}

// ── Particles ────────────────────────────────────────────
function spawnFlap() {
  for (let i = 0; i < 4; i++) {
    particles.push({
      x: drone.x, y: drone.y + 6,
      vx: (Math.random() - 0.5) * 2,
      vy: 1.5 + Math.random() * 1.5,
      life: 1, decay: 0.08 + Math.random() * 0.04, size: 1.5 + Math.random() * 2
    });
  }
}
function spawnCrash() {
  for (let i = 0; i < 20; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 2 + Math.random() * 4;
    particles.push({
      x: drone.x, y: drone.y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.5,
      life: 1, decay: 0.02 + Math.random() * 0.02, size: 2 + Math.random() * 4
    });
  }
}

// ── Input ────────────────────────────────────────────────
function flap() {
  if (state === 'idle' || state === 'dead') { startGame(); return; }
  drone.vy = FLAP_V;
  spawnFlap();
}
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); flap(); }
});
document.addEventListener('pointerdown', e => {
  if (e.target.id === 'back-btn') return;
  e.preventDefault();
  flap();
});
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('touchstart', e => { if (e.target.id !== 'back-btn') e.preventDefault(); }, { passive: false });

// ── Start ────────────────────────────────────────────────
function startGame() {
  state = 'running'; score = 0; tick = 0;
  pipes = []; particles = []; popups = []; pipeTimer = 0;
  pipeSpd = PIPE_SPD_BASE; shakeTime = 0; newBest = false;
  resetDrone();
  spawnPipe();
}

// ── Collision ────────────────────────────────────────────
function collides(p) {
  const px = drone.x - DW / 2 + 5, pw = DW - 10;
  const py = drone.y - DH / 2 + 3, ph = DH - 6;
  const inX = px < p.x + PIPE_W && px + pw > p.x;
  if (!inX) return false;
  return py < p.topH || py + ph > p.botY;
}

// ── Update ───────────────────────────────────────────────
function update(dt) {
  if (state !== 'running') return;
  tick++;
  propSpin += 0.38 * dt;

  drone.vy   += GRAVITY * dt;
  drone.y    += drone.vy * dt;
  drone.tilt  = Math.max(-28, Math.min(38, drone.vy * 3.8));

  if (drone.y - DH / 2 < 0 || drone.y + DH / 2 > H) { die(); return; }

  pipeTimer += dt;
  if (pipeTimer >= PIPE_INTERVAL) { spawnPipe(); pipeTimer = 0; }

  for (const p of pipes) {
    p.x -= pipeSpd * dt;
    if (!p.passed && p.x + PIPE_W < drone.x) {
      p.passed = true; score++;
      if (score > hiScore) {
        hiScore = score;
        localStorage.setItem('pp_fly_hi', hiScore);
        newBest = true;
      }
    }
    if (collides(p)) { die(); return; }
  }
  pipes = pipes.filter(p => p.x + PIPE_W > -10);

  pipeSpd = Math.min(PIPE_SPD_MAX, PIPE_SPD_BASE + score * 0.1);

  bgScroll -= pipeSpd * 0.25 * dt;

  particles.forEach(p => {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.1 * dt; p.life -= p.decay * dt;
  });
  particles = particles.filter(p => p.life > 0);
}

function die() { state = 'dead'; spawnCrash(); }

// ── Draw helpers ─────────────────────────────────────────
function drawBuilding(bx, by, bw, bh, wins, dark) {
  // Body
  ctx.fillStyle = dark ? '#0e0f18' : '#121420';
  ctx.fillRect(bx, by, bw, bh);
  // Left edge highlight
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  ctx.fillRect(bx, by, 2, bh);
  // Windows (pre-computed, stable)
  wins.forEach(({ c, r, warm }) => {
    const wx = bx + 4 + c * 11;
    const wy = by + 6 + r * 14;
    if (wx + 6 > bx + bw - 2 || wy + 7 > by + bh - 2) return;
    ctx.fillStyle = warm ? 'rgba(255,215,100,0.55)' : 'rgba(160,210,255,0.45)';
    ctx.fillRect(wx, wy, 6, 7);
  });
  // Roof ledge
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.fillRect(bx - 3, by + (bh < 0 ? 0 : bh - 5), bw + 6, 5);
}

function drawDrone(x, y, tilt, dead) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tilt * Math.PI / 180);

  const col  = dead ? '#ff5555' : '#d8d8d8';
  const dark = dead ? '#cc2222' : '#888888';
  const A    = 13; // arm radius

  // X-frame arms (diagonal)
  const motors = [[-A, -A * 0.6], [A, -A * 0.6], [-A, A * 0.6], [A, A * 0.6]];

  ctx.strokeStyle = dark;
  ctx.lineWidth = 2;
  motors.forEach(([mx, my]) => {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(mx, my);
    ctx.stroke();
  });

  // Central body
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.roundRect(-6, -4, 12, 8, 2);
  ctx.fill();

  // Top ridge detail
  ctx.fillStyle = dark;
  ctx.fillRect(-3, -4, 6, 2);

  // Camera dome (bottom center)
  ctx.fillStyle = dead ? '#cc2222' : '#222';
  ctx.beginPath();
  ctx.arc(0, 5, 4, 0, Math.PI);
  ctx.fill();
  ctx.fillStyle = dead ? '#ff8888' : '#4af';
  ctx.beginPath();
  ctx.arc(0, 5, 2, 0, Math.PI * 2);
  ctx.fill();

  // Motors + props
  motors.forEach(([mx, my], i) => {
    // Motor housing
    ctx.fillStyle = dark;
    ctx.beginPath();
    ctx.arc(mx, my, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(mx, my, 2, 0, Math.PI * 2);
    ctx.fill();

    // Spinning blades
    ctx.save();
    ctx.translate(mx, my);
    ctx.rotate(propSpin * (i % 2 === 0 ? 1 : -1));
    ctx.strokeStyle = dead ? 'rgba(255,80,80,0.7)' : 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 1.8;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-8, 0); ctx.lineTo(8, 0);
    ctx.stroke();
    ctx.rotate(Math.PI / 2);
    ctx.beginPath();
    ctx.moveTo(-6, 0); ctx.lineTo(6, 0);
    ctx.stroke();
    ctx.restore();
  });

  // Nav LEDs: green front-right, red back-left
  ctx.fillStyle = dead ? '#ff4444' : '#44ff88';
  ctx.beginPath(); ctx.arc(A, -A * 0.6, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ff4444';
  ctx.beginPath(); ctx.arc(-A, A * 0.6, 1.8, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

// ── Sky gradient cache ────────────────────────────────────
let skyCache = null, lastSpeedT = -1;
function getSky(speedT) {
  if (Math.abs(speedT - lastSpeedT) < 0.01 && skyCache) return skyCache;
  lastSpeedT = speedT;
  const top = lerpColor('#07080f', '#1a0608', speedT);
  const mid = lerpColor('#0d1022', '#220e0a', speedT);
  const bot = lerpColor('#16102e', '#3a1005', speedT);
  skyCache = ctx.createLinearGradient(0, 0, 0, H);
  skyCache.addColorStop(0,   top);
  skyCache.addColorStop(0.7, mid);
  skyCache.addColorStop(1,   bot);
  return skyCache;
}

// ── Draw ─────────────────────────────────────────────────
function draw() {
  const speedT = Math.max(0, Math.min(1, (pipeSpd - PIPE_SPD_BASE) / (PIPE_SPD_MAX - PIPE_SPD_BASE)));

  // Sky
  ctx.fillStyle = getSky(speedT);
  ctx.fillRect(0, 0, W, H);

  // Stars — single drawImage instead of 55 arc calls
  ctx.globalAlpha = 0.7 + 0.3 * Math.sin(tick * 0.018);
  ctx.drawImage(starCanvas, 0, 0);
  ctx.globalAlpha = 1;

  // Distant bg buildings (parallax)
  bgBuilds.forEach(b => {
    const bx = ((b.x + bgScroll % (W + 200)) + W + 200) % (W + 200) - 100;
    ctx.fillStyle = 'rgba(14,15,26,0.7)';
    ctx.fillRect(bx, H - b.h, b.w, b.h);
    ctx.fillStyle = 'rgba(255,255,255,0.025)';
    ctx.fillRect(bx, H - b.h, 1, b.h);
  });

  // Pipe buildings
  pipes.forEach(p => {
    // Top building (hangs from top)
    drawBuilding(p.x, 0, PIPE_W, p.topH, p.topWins, false);
    // Bottom building (rises from bottom)
    drawBuilding(p.x, p.botY, PIPE_W, p.botH, p.botWins, false);
    // Roof caps
    ctx.fillStyle = 'rgba(255,255,255,0.13)';
    ctx.fillRect(p.x - 3, p.topH - 6, PIPE_W + 6, 6);
    ctx.fillRect(p.x - 3, p.botY,     PIPE_W + 6, 6);
  });

  // Ground glow
  const glow = ctx.createLinearGradient(0, H - 40, 0, H);
  glow.addColorStop(0, 'rgba(60,40,140,0)');
  glow.addColorStop(1, 'rgba(60,40,140,0.22)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, H - 40, W, 40);

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life * 0.9;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  });
  ctx.globalAlpha = 1;

  // Drone
  drawDrone(drone.x, drone.y, drone.tilt, state === 'dead');

  // Score
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.font = `48px 'Bebas Neue', sans-serif`;
  ctx.fillText(score, W / 2, 54);

  if (hiScore > 0) {
    ctx.fillStyle = newBest && state === 'running' ? 'rgba(255,220,60,0.6)' : 'rgba(255,255,255,0.22)';
    ctx.font = `18px 'Bebas Neue', sans-serif`;
    ctx.fillText(`BEST  ${hiScore}`, W / 2, 76);
  }

  // Idle
  if (state === 'idle') {
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.font = `56px 'Bebas Neue', sans-serif`;
    ctx.fillText('PHANTOM FLY', W / 2, H * 0.32);
    ctx.fillStyle = 'rgba(255,255,255,0.32)';
    ctx.font = `16px 'Barlow Condensed', sans-serif`;
    ctx.fillText('TAP  ·  CLICK  ·  SPACE  TO  FLY', W / 2, H * 0.32 + 30);
  }

  // Dead
  if (state === 'dead') {
    const medal = score >= 50 ? 'gold' : score >= 25 ? 'silver' : score >= 10 ? 'bronze' : null;
    const cx = W / 2;

    // Measure total content height
    let totalH = 24 + 52 + 16 + 28; // padding + CRASHED + gap + SCORE
    if (newBest) totalH += 14 + 28;  // gap + NEW BEST
    if (medal)   totalH += 20 + 64 + 20; // gap + medal + label gap
    totalH += 18 + 20 + 16; // gap + tap + padding

    const boxTop = H * 0.5 - totalH / 2;

    // Box with border
    ctx.fillStyle = 'rgba(5,6,14,0.82)';
    ctx.beginPath();
    ctx.roundRect(16, boxTop, W - 32, totalH, 8);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(16, boxTop, W - 32, totalH, 8);
    ctx.stroke();

    ctx.textAlign = 'center';
    let y = boxTop + 24;

    // CRASHED
    y += 52;
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.font = `56px 'Bebas Neue', sans-serif`;
    ctx.fillText('CRASHED', cx, y);

    // Divider
    y += 12;
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx - 60, y); ctx.lineTo(cx + 60, y);
    ctx.stroke();

    // SCORE
    y += 24;
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = `26px 'Bebas Neue', sans-serif`;
    ctx.fillText(`SCORE  ${score}`, cx, y);

    // NEW BEST
    if (newBest) {
      y += 22;
      ctx.fillStyle = `rgba(255,${Math.floor(185 + Math.sin(tick * 0.15) * 55)},40,0.95)`;
      ctx.font = `24px 'Bebas Neue', sans-serif`;
      ctx.fillText('✦  NEW BEST  ✦', cx, y);
    }

    // MEDAL
    if (medal) {
      y += 28;
      drawMedal(cx, y + 32, medal);
      y += 64 + 20;
    }

    // TAP
    y += 18;
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.font = `700 13px 'Barlow Condensed', sans-serif`;
    ctx.fillText('TAP TO FLY AGAIN', cx, y);
  }

}

// ── Medal ────────────────────────────────────────────────
function drawMedal(x, y, tier) {
  const colors = {
    bronze: { mid: '#cd7f32', dark: '#8b4513', light: '#f0c080', glow: 'rgba(205,127,50,' },
    silver: { mid: '#c0c0c0', dark: '#808080', light: '#f0f0f0', glow: 'rgba(192,192,192,' },
    gold:   { mid: '#ffd700', dark: '#b8860b', light: '#fff9a0', glow: 'rgba(255,215,0,'  }
  };
  const labels = { bronze: 'BRONZE', silver: 'SILVER', gold: 'GOLD' };
  const { mid, dark, light, glow } = colors[tier];
  const R = 32;

  // Outer glow
  const glowGrad = ctx.createRadialGradient(x, y, R * 0.5, x, y, R * 2.2);
  glowGrad.addColorStop(0, glow + '0.35)');
  glowGrad.addColorStop(1, glow + '0)');
  ctx.fillStyle = glowGrad;
  ctx.beginPath();
  ctx.arc(x, y, R * 2.2, 0, Math.PI * 2);
  ctx.fill();

  // Outer ring
  const ring = ctx.createRadialGradient(x - R * 0.35, y - R * 0.35, 2, x, y, R);
  ring.addColorStop(0, light);
  ring.addColorStop(0.55, mid);
  ring.addColorStop(1, dark);
  ctx.fillStyle = ring;
  ctx.beginPath();
  ctx.arc(x, y, R, 0, Math.PI * 2);
  ctx.fill();

  // Inner recessed circle
  const inner = ctx.createRadialGradient(x - 5, y - 5, 1, x, y, R * 0.7);
  inner.addColorStop(0, light);
  inner.addColorStop(1, mid);
  ctx.fillStyle = inner;
  ctx.beginPath();
  ctx.arc(x, y, R * 0.7, 0, Math.PI * 2);
  ctx.fill();

  // Rim detail
  ctx.beginPath();
  ctx.arc(x, y, R, 0, Math.PI * 2);
  ctx.strokeStyle = light;
  ctx.lineWidth = 1.5;
  ctx.globalAlpha = 0.4;
  ctx.stroke();
  ctx.globalAlpha = 1;

  // Star
  ctx.fillStyle = dark;
  ctx.font = `bold ${R * 0.9}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('★', x, y + 1);
  ctx.textBaseline = 'alphabetic';

  // Label
  ctx.fillStyle = mid;
  ctx.font = `700 13px 'Barlow Condensed', sans-serif`;
  ctx.fillText(labels[tier], x, y + R + 18);
}

// ── Back button ──────────────────────────────────────────
function goBack() {
  if (window.parent !== window) {
    window.parent.closeGame();
  } else {
    window.location.href = '/';
  }
}

// ── Loop ─────────────────────────────────────────────────
let lastTime = 0;
function loop(ts) {
  const deltaMs = lastTime ? Math.min(ts - lastTime, 50) : 16.667;
  const dt = deltaMs / 16.667;
  lastTime = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
