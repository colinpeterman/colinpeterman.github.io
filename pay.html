    body {
      background: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .pay-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: url('images/checkout/000117700002.jpg') center/cover no-repeat;
      transform: scale(1);
    }

    .pay-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.15);
    }

    .gallery-nav {
      position: relative;
      z-index: 10;
    }

    .pay-main, .gallery-footer {
      position: relative;
      z-index: 1;
    }

    .pay-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(var(--nav-h) + 40px) 24px 40px;
    }

    .pay-card {
      background: rgba(10,10,9,0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 4px;
      padding: 56px 48px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .pay-logo {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      margin-bottom: 40px;
    }

    .pay-title {
      font-family: var(--font-disp);
      font-size: clamp(36px, 8vw, 52px);
      letter-spacing: 0.04em;
      line-height: 1;
      margin-bottom: 12px;
    }

    .pay-description {
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 300;
      color: rgba(255,255,255,0.55);
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .pay-amount {
      font-family: var(--font-cond);
      font-size: 40px;
      font-weight: 600;
      letter-spacing: 0.04em;
      margin-bottom: 36px;
    }

    .pay-btn {
      display: inline-block;
      background: #fff;
      color: #111;
      font-family: var(--font-cond);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 16px 40px;
      border-radius: 2px;
      transition: background 0.2s, color 0.2s;
      cursor: pointer;
      text-decoration: none;
    }

    .pay-btn:hover {
      background: rgba(255,255,255,0.85);
    }

    .pay-secure {
      margin-top: 24px;
      font-family: var(--font-body);
      font-size: 12px;
      color: rgba(255,255,255,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .pay-secure svg {
      width: 12px;
      height: 12px;
      opacity: 0.5;
    }

    @media (max-width: 520px) {
      .pay-card {
        padding: 40px 28px;
      }
